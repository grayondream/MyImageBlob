<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 820" width="100%" role="img" aria-label="FlashAttention-3 生产者消费者流水线">
  <title>图 4-1 FA3：TMA 生产者、WGMMA 消费者、softmax 交错与多级 SMEM</title>
  <desc>时间轴展示生产者 TMA 加载、消费者 A 的 WGMMA QKᵀ 与 PV、消费者 B 的 online softmax 如何错开一个时间单位重叠执行；虚线箭头表示数据就绪依赖；底部对比 FA2 的串行气泡。</desc>
  <defs>
    <marker id="arr41" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .t41{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
      .s41{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#475569}
      .xs41{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#64748b}
      .tm41{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5;rx:6}
      .tc41{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5;rx:6}
      .sf41{fill:#ffedd5;stroke:#ea580c;stroke-width:1.5;rx:6}
      .wr41{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5;rx:6}
      .bar41{fill:#fef3c7;stroke:#d97706;stroke-width:1.2;rx:4}
      .gap41{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4,3;rx:4}
      .grid41{stroke:#e2e8f0;stroke-width:1;stroke-dasharray:3,4}
    </style>
  </defs>
  <rect x="0" y="0" width="1220" height="820" fill="#ffffff"/>

  <!-- 标题与副标题 -->
  <text x="30" y="36" class="t41" font-size="24" font-weight="700">图 4-1 FA3 的 Hopper 流水线：生产者搬、消费者算，softmax 与 GEMM 交错</text>
  <text x="30" y="62" class="s41" font-size="14">关键变化：TMA 单线程提交不阻塞；WGMMA 直接读 SMEM；生产者/消费者用 mbarrier 同步；多级 SMEM buffer 让第 k+1 块加载与第 k 块计算重叠。</text>

  <!-- 图例 -->
  <rect x="30" y="82" width="16" height="16" rx="3" class="tm41"/>
  <text x="52" y="95" class="s41" font-size="12">TMA 搬运</text>
  <rect x="130" y="82" width="16" height="16" rx="3" class="tc41"/>
  <text x="152" y="95" class="s41" font-size="12">WGMMA（Tensor Core）</text>
  <rect x="300" y="82" width="16" height="16" rx="3" class="sf41"/>
  <text x="322" y="95" class="s41" font-size="12">online softmax（CUDA Core / SFU）</text>
  <rect x="545" y="82" width="16" height="16" rx="3" class="wr41"/>
  <text x="567" y="95" class="s41" font-size="12">HBM 写回</text>
  <line x1="650" y1="90" x2="680" y2="90" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr41)"/>
  <text x="688" y="95" class="s41" font-size="12">数据就绪依赖</text>

  <!-- 主图背景 -->
  <rect x="20" y="115" width="1180" height="345" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- 时间刻度 -->
  <line x1="200" y1="145" x2="1170" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <g class="xs41" font-size="12" text-anchor="middle">
    <text x="200" y="132">t0</text>
    <text x="321" y="132">t1</text>
    <text x="442" y="132">t2</text>
    <text x="563" y="132">t3</text>
    <text x="684" y="132">t4</text>
    <text x="805" y="132">t5</text>
    <text x="926" y="132">t6</text>
    <text x="1047" y="132">t7</text>
  </g>
  <!-- 网格线 -->
  <line x1="200" y1="145" x2="200" y2="450" class="grid41"/>
  <line x1="321" y1="145" x2="321" y2="450" class="grid41"/>
  <line x1="442" y1="145" x2="442" y2="450" class="grid41"/>
  <line x1="563" y1="145" x2="563" y2="450" class="grid41"/>
  <line x1="684" y1="145" x2="684" y2="450" class="grid41"/>
  <line x1="805" y1="145" x2="805" y2="450" class="grid41"/>
  <line x1="926" y1="145" x2="926" y2="450" class="grid41"/>
  <line x1="1047" y1="145" x2="1047" y2="450" class="grid41"/>

  <!-- 行标签 -->
  <text x="35" y="172" class="t41" font-size="13" font-weight="700">生产者</text>
  <text x="35" y="190" class="s41" font-size="11">TMA 加载 K/V</text>
  <text x="35" y="232" class="t41" font-size="13" font-weight="700">消费者 A</text>
  <text x="35" y="250" class="s41" font-size="11">WGMMA QKᵀ</text>
  <text x="35" y="292" class="t41" font-size="13" font-weight="700">消费者 B</text>
  <text x="35" y="310" class="s41" font-size="11">online softmax</text>
  <text x="35" y="352" class="t41" font-size="13" font-weight="700">消费者 A</text>
  <text x="35" y="370" class="s41" font-size="11">WGMMA PV</text>
  <text x="35" y="412" class="t41" font-size="13" font-weight="700">写回</text>
  <text x="35" y="430" class="s41" font-size="11">O 块 → HBM</text>

  <!-- 生产者 TMA -->
  <rect x="200" y="160" width="121" height="40" class="tm41"/>
  <text x="260" y="185" text-anchor="middle" class="t41" font-size="12">TMA 块 0</text>
  <rect x="321" y="160" width="121" height="40" class="tm41"/>
  <text x="381" y="185" text-anchor="middle" class="t41" font-size="12">TMA 块 1</text>
  <rect x="442" y="160" width="121" height="40" class="tm41"/>
  <text x="502" y="185" text-anchor="middle" class="t41" font-size="12">TMA 块 2</text>
  <rect x="563" y="160" width="121" height="40" class="tm41"/>
  <text x="623" y="185" text-anchor="middle" class="t41" font-size="12">TMA 块 3</text>

  <!-- 消费者 A QK -->
  <rect x="321" y="220" width="121" height="40" class="tc41"/>
  <text x="381" y="245" text-anchor="middle" class="t41" font-size="12">QKᵀ 块 0</text>
  <rect x="442" y="220" width="121" height="40" class="tc41"/>
  <text x="502" y="245" text-anchor="middle" class="t41" font-size="12">QKᵀ 块 1</text>
  <rect x="563" y="220" width="121" height="40" class="tc41"/>
  <text x="623" y="245" text-anchor="middle" class="t41" font-size="12">QKᵀ 块 2</text>

  <!-- 消费者 B softmax -->
  <rect x="442" y="280" width="121" height="40" class="sf41"/>
  <text x="502" y="305" text-anchor="middle" class="t41" font-size="12">softmax 0</text>
  <rect x="563" y="280" width="121" height="40" class="sf41"/>
  <text x="623" y="305" text-anchor="middle" class="t41" font-size="12">softmax 1</text>
  <rect x="684" y="280" width="121" height="40" class="sf41"/>
  <text x="744" y="305" text-anchor="middle" class="t41" font-size="12">softmax 2</text>

  <!-- 消费者 A PV -->
  <rect x="563" y="340" width="121" height="40" class="tc41"/>
  <text x="623" y="365" text-anchor="middle" class="t41" font-size="12">PV 块 0</text>
  <rect x="684" y="340" width="121" height="40" class="tc41"/>
  <text x="744" y="365" text-anchor="middle" class="t41" font-size="12">PV 块 1</text>
  <rect x="805" y="340" width="121" height="40" class="tc41"/>
  <text x="865" y="365" text-anchor="middle" class="t41" font-size="12">PV 块 2</text>

  <!-- 写回 -->
  <rect x="926" y="400" width="121" height="40" class="wr41"/>
  <text x="986" y="425" text-anchor="middle" class="t41" font-size="12">O 块写回</text>

  <!-- 依赖箭头：上一行块完成 → 下一行对应块开始 -->
  <line x1="321" y1="200" x2="321" y2="218" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr41)"/>
  <line x1="442" y1="260" x2="442" y2="278" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr41)"/>
  <line x1="563" y1="320" x2="563" y2="338" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr41)"/>
  <line x1="926" y1="380" x2="926" y2="398" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr41)"/>

  <!-- 多级 SMEM buffer 示意 -->
  <rect x="700" y="160" width="320" height="40" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>
  <text x="860" y="185" text-anchor="middle" class="xs41" font-size="11">多级 SMEM buffer（环形）</text>

  <!-- 右侧注释 -->
  <text x="1060" y="185" class="s41" font-size="10">单线程提交</text>
  <text x="1060" y="199" class="s41" font-size="10">不阻塞</text>
  <text x="1060" y="245" class="s41" font-size="10">直读 SMEM</text>
  <text x="1060" y="259" class="s41" font-size="10">无 ldmatrix</text>
  <text x="1060" y="305" class="s41" font-size="10">CUDA Core</text>
  <text x="1060" y="319" class="s41" font-size="10">SFU</text>
  <text x="1060" y="365" class="s41" font-size="10">P 直接进</text>
  <text x="1060" y="379" class="s41" font-size="10">Tensor Core</text>
  <text x="1060" y="425" class="s41" font-size="10">唯一一次</text>
  <text x="1060" y="439" class="s41" font-size="10">HBM 写</text>

  <!-- 读图提示 -->
  <text x="30" y="478" class="s41" font-size="12">读图：每一行的块错开一个时间单位——TMA 块 k 加载时，消费者 A 在算 QKᵀ 块 k−1，消费者 B 在做 softmax 块 k−2，消费者 A 在算 PV 块 k−3。</text>

  <!-- 底部对比：FA2 串行 -->
  <rect x="30" y="490" width="560" height="230" fill="#fff7ed" stroke="#fb923c"/>
  <text x="50" y="518" class="t41" font-size="16" font-weight="700">FA2 在 H100 上的串行气泡</text>
  <text x="50" y="540" class="s41" font-size="12">加载 → sync → QKᵀ → softmax → PV → sync → 下一块</text>

  <rect x="50" y="555" width="90" height="34" class="bar41"/>
  <text x="95" y="577" text-anchor="middle" class="s41" font-size="11">加载 K/V</text>
  <rect x="140" y="555" width="50" height="34" class="gap41"/>
  <text x="165" y="577" text-anchor="middle" class="s41" font-size="10">sync</text>
  <rect x="190" y="555" width="90" height="34" class="tc41"/>
  <text x="235" y="577" text-anchor="middle" class="s41" font-size="11">QKᵀ</text>
  <rect x="280" y="555" width="90" height="34" class="sf41"/>
  <text x="325" y="577" text-anchor="middle" class="s41" font-size="11">softmax</text>
  <rect x="370" y="555" width="90" height="34" class="tc41"/>
  <text x="415" y="577" text-anchor="middle" class="s41" font-size="11">PV</text>
  <rect x="460" y="555" width="50" height="34" class="gap41"/>
  <text x="485" y="577" text-anchor="middle" class="s41" font-size="10">sync</text>
  <rect x="510" y="555" width="60" height="34" class="bar41"/>
  <text x="540" y="577" text-anchor="middle" class="s41" font-size="10">下一块</text>

  <text x="50" y="625" class="s41" font-size="12">搬运和 Tensor Core 互相等；</text>
  <text x="50" y="645" class="s41" font-size="12">TMA 和 WGMMA 的异步能力未兑现。</text>
  <text x="50" y="675" class="t41" font-size="13" font-weight="700">结果：H100 上仅约 35% 峰值，</text>
  <text x="50" y="695" class="t41" font-size="13" font-weight="700">而调优 GEMM 可到 80%–90%。</text>

  <!-- 底部对比：FA3 重叠 -->
  <rect x="610" y="490" width="580" height="230" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="630" y="518" class="t41" font-size="16" font-weight="700">FA3：生产者–消费者重叠</text>
  <text x="630" y="544" class="s41" font-size="12">① TMA 单线程提交，加载不占计算 warp 执行槽；</text>
  <text x="630" y="568" class="s41" font-size="12">② WGMMA 异步，直接读 SMEM，省掉 ldmatrix 往返；</text>
  <text x="630" y="592" class="s41" font-size="12">③ 多级 SMEM + mbarrier：第 k+1 块加载与第 k 块计算重叠；</text>
  <text x="630" y="616" class="s41" font-size="12">④ GEMM-I → softmax → GEMM-II 交错，Tensor Core 与 SFU 互不空等；</text>
  <text x="630" y="640" class="s41" font-size="12">⑤ FP8 + block quantization + Hadamard 旋转控制误差。</text>
  <text x="630" y="672" class="t41" font-size="13" font-weight="700">效果：FP16 从 35% 提升到 75%（740 TFLOPS）；</text>
  <text x="630" y="694" class="t41" font-size="13" font-weight="700">FP8 约 1.2 PFLOPS，相对 FA2 前向 1.5–2.0×。</text>
</svg>