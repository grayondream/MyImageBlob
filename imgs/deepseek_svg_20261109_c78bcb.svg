<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <linearGradient id="endBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="endGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="500" fill="#f8fafc"/>

  <text x="460" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    页表遍历级数对比：4 KB 页 vs 2 MB 页
  </text>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#64748b">
    大页在 PD 级提前终止，省去一次访存，同时扩大 TLB 覆盖范围
  </text>

  <!-- 左栏：4 KB 页 -->
  <rect x="40" y="86" width="400" height="378" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="240" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">4 KB 页：4 级漫游</text>

  <g>
    <rect x="120" y="140" width="240" height="42" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="240" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">PML4</text>
  </g>

  <g>
    <rect x="120" y="194" width="240" height="42" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="240" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">PDPT</text>
  </g>

  <g>
    <rect x="120" y="248" width="240" height="42" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="240" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">PD</text>
  </g>

  <g>
    <rect x="120" y="302" width="240" height="42" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="240" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">PT</text>
  </g>

  <line x1="240" y1="182" x2="240" y2="192" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="240" y1="236" x2="240" y2="246" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="240" y1="290" x2="240" y2="300" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="240" y1="344" x2="240" y2="372" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <rect x="120" y="378" width="240" height="46" rx="10" fill="url(#endBlue)" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="240" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">→ 4 KB 页框</text>

  <text x="240" y="450" text-anchor="middle" font-size="11" fill="#64748b">4 次访存 · 覆盖 4 KB</text>

  <!-- 右栏：2 MB 页 -->
  <rect x="480" y="86" width="400" height="378" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="680" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">2 MB 页：3 级，PD 终止</text>

  <g>
    <rect x="560" y="140" width="240" height="42" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="680" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">PML4</text>
  </g>

  <g>
    <rect x="560" y="194" width="240" height="42" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="680" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">PDPT</text>
  </g>

  <g>
    <rect x="560" y="248" width="240" height="42" rx="10" fill="url(#endGreen)" stroke="#10b981" stroke-width="2"/>
    <text x="680" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">PD → 直接得到 2 MB 页框</text>
  </g>

  <line x1="680" y1="182" x2="680" y2="192" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="236" x2="680" y2="246" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="290" x2="680" y2="318" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowEnd)"/>

  <rect x="560" y="324" width="240" height="42" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="680" y="350" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">PT 跳过</text>

  <line x1="680" y1="366" x2="680" y2="382" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <rect x="560" y="378" width="240" height="46" rx="10" fill="url(#endGreen)" stroke="#10b981" stroke-width="1.3"/>
  <text x="680" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">→ 2 MB 页框</text>

  <text x="680" y="450" text-anchor="middle" font-size="11" fill="#64748b">3 次访存 · 覆盖 2 MB</text>

  <!-- 中间连接提示 -->
  <line x1="440" y1="269" x2="480" y2="269" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="460" cy="269" r="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="460" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">VS</text>
</svg>