<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .c0 { fill: hsl(0,75%,89%); stroke: hsl(0,65%,60%); }
      .c1 { fill: hsl(36,78%,88%); stroke: hsl(36,70%,55%); }
      .c2 { fill: hsl(72,70%,85%); stroke: hsl(72,55%,45%); }
      .c3 { fill: hsl(108,62%,86%); stroke: hsl(108,50%,45%); }
      .c4 { fill: hsl(144,58%,86%); stroke: hsl(144,45%,43%); }
      .c5 { fill: hsl(180,55%,86%); stroke: hsl(180,45%,42%); }
      .c6 { fill: hsl(216,72%,89%); stroke: hsl(216,58%,55%); }
      .c7 { fill: hsl(252,72%,90%); stroke: hsl(252,55%,60%); }
      .c8 { fill: hsl(288,68%,90%); stroke: hsl(288,50%,58%); }
      .cell { stroke-width: 2; }
      
      /* 基础字体设置 */
      .txt { font-family: 'PingFang SC','Microsoft YaHei',ui-sans-serif,system-ui,sans-serif; font-size: 15px; font-weight: 700; fill: #1b1b2f; text-anchor: middle; }
      .sub { font-size: 10px; font-weight: 600; }
      .seq-txt { font-family: 'PingFang SC','Microsoft YaHei',ui-sans-serif,system-ui,sans-serif; font-size: 13px; font-weight: 700; fill: #1b1b2f; text-anchor: middle; }
      .title { font-family: 'PingFang SC','Microsoft YaHei',ui-sans-serif,system-ui,sans-serif; font-size: 16px; font-weight: 700; fill: #1b1b2f; text-anchor: middle; }
      .subtitle { font-family: 'PingFang SC','Microsoft YaHei',ui-sans-serif,system-ui,sans-serif; font-size: 12px; font-weight: 400; fill: #777; text-anchor: middle; }
      .formula { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <!-- 确保在深色模式下背景也是白色的 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 矩阵标题 -->
  <text x="400" y="40" class="title">矩阵 A（3 × 3，i 为行号，j 为列号）</text>

  <!-- ====== 3x3 矩阵 ====== -->
  <!-- 第 0 行 -->
  <rect x="315" y="60" width="50" height="50" rx="10" ry="10" class="cell c0" />
  <text x="340" y="85" class="txt">a<tspan dy="4" class="sub">00</tspan></text>
  
  <rect x="375" y="60" width="50" height="50" rx="10" ry="10" class="cell c1" />
  <text x="400" y="85" class="txt">a<tspan dy="4" class="sub">01</tspan></text>
  
  <rect x="435" y="60" width="50" height="50" rx="10" ry="10" class="cell c2" />
  <text x="460" y="85" class="txt">a<tspan dy="4" class="sub">02</tspan></text>

  <!-- 第 1 行 -->
  <rect x="315" y="120" width="50" height="50" rx="10" ry="10" class="cell c3" />
  <text x="340" y="145" class="txt">a<tspan dy="4" class="sub">10</tspan></text>
  
  <rect x="375" y="120" width="50" height="50" rx="10" ry="10" class="cell c4" />
  <text x="400" y="145" class="txt">a<tspan dy="4" class="sub">11</tspan></text>
  
  <rect x="435" y="120" width="50" height="50" rx="10" ry="10" class="cell c5" />
  <text x="460" y="145" class="txt">a<tspan dy="4" class="sub">12</tspan></text>

  <!-- 第 2 行 -->
  <rect x="315" y="180" width="50" height="50" rx="10" ry="10" class="cell c6" />
  <text x="340" y="205" class="txt">a<tspan dy="4" class="sub">20</tspan></text>
  
  <rect x="375" y="180" width="50" height="50" rx="10" ry="10" class="cell c7" />
  <text x="400" y="205" class="txt">a<tspan dy="4" class="sub">21</tspan></text>
  
  <rect x="435" y="180" width="50" height="50" rx="10" ry="10" class="cell c8" />
  <text x="460" y="205" class="txt">a<tspan dy="4" class="sub">22</tspan></text>


  <!-- ====== ① 行主序 ====== -->
  <text x="400" y="260" class="title">① 行主序 Row-major</text>
  <text x="400" y="278" class="subtitle">C / C++ / Rust / NumPy 默认</text>

  <!-- 行主序内存序列 -->
  <rect x="155" y="295" width="50" height="50" rx="8" ry="8" class="cell c0" />
  <text x="180" y="318" class="seq-txt">a<tspan dy="4" class="sub">00</tspan></text>

  <rect x="210" y="295" width="50" height="50" rx="8" ry="8" class="cell c1" />
  <text x="235" y="318" class="seq-txt">a<tspan dy="4" class="sub">01</tspan></text>

  <rect x="265" y="295" width="50" height="50" rx="8" ry="8" class="cell c2" />
  <text x="290" y="318" class="seq-txt">a<tspan dy="4" class="sub">02</tspan></text>

  <rect x="320" y="295" width="50" height="50" rx="8" ry="8" class="cell c3" />
  <text x="345" y="318" class="seq-txt">a<tspan dy="4" class="sub">10</tspan></text>

  <rect x="375" y="295" width="50" height="50" rx="8" ry="8" class="cell c4" />
  <text x="400" y="318" class="seq-txt">a<tspan dy="4" class="sub">11</tspan></text>

  <rect x="430" y="295" width="50" height="50" rx="8" ry="8" class="cell c5" />
  <text x="455" y="318" class="seq-txt">a<tspan dy="4" class="sub">12</tspan></text>

  <rect x="485" y="295" width="50" height="50" rx="8" ry="8" class="cell c6" />
  <text x="510" y="318" class="seq-txt">a<tspan dy="4" class="sub">20</tspan></text>

  <rect x="540" y="295" width="50" height="50" rx="8" ry="8" class="cell c7" />
  <text x="565" y="318" class="seq-txt">a<tspan dy="4" class="sub">21</tspan></text>

  <rect x="595" y="295" width="50" height="50" rx="8" ry="8" class="cell c8" />
  <text x="620" y="318" class="seq-txt">a<tspan dy="4" class="sub">22</tspan></text>

  <!-- 行主序公式 -->
  <text x="400" y="385" class="formula">offset = i × 3 + j</text>


  <!-- ====== ② 列主序 ====== -->
  <text x="400" y="440" class="title">② 列主序 Column-major</text>
  <text x="400" y="458" class="subtitle">Fortran / MATLAB / Julia / OpenGL</text>

  <!-- 列主序内存序列 -->
  <rect x="155" y="475" width="50" height="50" rx="8" ry="8" class="cell c0" />
  <text x="180" y="498" class="seq-txt">a<tspan dy="4" class="sub">00</tspan></text>

  <rect x="210" y="475" width="50" height="50" rx="8" ry="8" class="cell c3" />
  <text x="235" y="498" class="seq-txt">a<tspan dy="4" class="sub">10</tspan></text>

  <rect x="265" y="475" width="50" height="50" rx="8" ry="8" class="cell c6" />
  <text x="290" y="498" class="seq-txt">a<tspan dy="4" class="sub">20</tspan></text>

  <rect x="320" y="475" width="50" height="50" rx="8" ry="8" class="cell c1" />
  <text x="345" y="498" class="seq-txt">a<tspan dy="4" class="sub">01</tspan></text>

  <rect x="375" y="475" width="50" height="50" rx="8" ry="8" class="cell c4" />
  <text x="400" y="498" class="seq-txt">a<tspan dy="4" class="sub">11</tspan></text>

  <rect x="430" y="475" width="50" height="50" rx="8" ry="8" class="cell c7" />
  <text x="455" y="498" class="seq-txt">a<tspan dy="4" class="sub">21</tspan></text>

  <rect x="485" y="475" width="50" height="50" rx="8" ry="8" class="cell c2" />
  <text x="510" y="498" class="seq-txt">a<tspan dy="4" class="sub">02</tspan></text>

  <rect x="540" y="475" width="50" height="50" rx="8" ry="8" class="cell c5" />
  <text x="565" y="498" class="seq-txt">a<tspan dy="4" class="sub">12</tspan></text>

  <rect x="595" y="475" width="50" height="50" rx="8" ry="8" class="cell c8" />
  <text x="620" y="498" class="seq-txt">a<tspan dy="4" class="sub">22</tspan></text>

  <!-- 列主序公式 -->
  <text x="400" y="565" class="formula">offset = j × 3 + i</text>

</svg>