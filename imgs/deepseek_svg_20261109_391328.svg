<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#f8fafc"/>

  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    虚拟地址到物理地址转换：TLB + 4 级页表
  </text>

  <!-- CPU / MMU -->
  <rect x="40" y="70" width="260" height="360" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="170" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">CPU 核（含 MMU）</text>

  <rect x="60" y="112" width="220" height="58" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="170" y="146" text-anchor="middle" font-size="13" fill="#1e40af">MMU 地址转换单元</text>

  <rect x="80" y="195" width="180" height="54" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="170" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">TLB</text>
  <text x="170" y="238" text-anchor="middle" font-size="10" fill="#c2410c">转换后备缓冲器</text>

  <rect x="92" y="260" width="156" height="26" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="170" y="277" text-anchor="middle" font-size="11" fill="#9a3412">L1 dTLB 64</text>

  <rect x="92" y="292" width="156" height="26" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="170" y="309" text-anchor="middle" font-size="11" fill="#9a3412">L2 STLB 1536</text>

  <line x1="12" y1="141" x2="58" y2="141" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="14" y="130" fill="#334155" font-size="12" font-weight="700">VA</text>
  <text x="14" y="158" fill="#64748b" font-size="10">虚拟地址</text>

  <!-- Page table -->
  <rect x="360" y="70" width="220" height="360" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="470" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">页表（4 级）</text>

  <rect x="382" y="116" width="176" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="470" y="142" text-anchor="middle" font-size="13" fill="#5b21b6">PML4</text>

  <rect x="382" y="174" width="176" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="470" y="200" text-anchor="middle" font-size="13" fill="#5b21b6">PDPT</text>

  <rect x="382" y="232" width="176" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="470" y="258" text-anchor="middle" font-size="13" fill="#5b21b6">PD</text>

  <rect x="382" y="290" width="176" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="470" y="316" text-anchor="middle" font-size="13" fill="#5b21b6">PT</text>

  <line x1="470" y1="158" x2="470" y2="172" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="470" y1="216" x2="470" y2="230" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="470" y1="274" x2="470" y2="288" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <text x="470" y="360" text-anchor="middle" font-size="11" fill="#6d28d9">4 KB 页：4 级全走</text>

  <!-- Physical memory -->
  <rect x="660" y="70" width="220" height="360" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="770" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">物理内存</text>

  <rect x="680" y="112" width="180" height="260" rx="8" fill="#ffffff" stroke="#86efac"/>
  <line x1="690" y1="142" x2="850" y2="142" stroke="#d1fae5"/>
  <line x1="690" y1="172" x2="850" y2="172" stroke="#d1fae5"/>
  <line x1="690" y1="202" x2="850" y2="202" stroke="#d1fae5"/>
  <line x1="690" y1="232" x2="850" y2="232" stroke="#d1fae5"/>
  <line x1="690" y1="262" x2="850" y2="262" stroke="#d1fae5"/>
  <line x1="690" y1="292" x2="850" y2="292" stroke="#d1fae5"/>
  <line x1="690" y1="322" x2="850" y2="322" stroke="#d1fae5"/>
  <line x1="690" y1="352" x2="850" y2="352" stroke="#d1fae5"/>

  <!-- TLB hit -->
  <path d="M260 222 H318 V52 H770 V110" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="544" y="44" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">TLB 命中：直接得到 PFN</text>

  <!-- TLB miss to page table -->
  <path d="M280 141 H320 V137 H378" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="300" y="128" fill="#b91c1c" font-size="11" font-weight="700">miss</text>

  <!-- Page table to physical memory -->
  <line x1="558" y1="311" x2="678" y2="311" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="618" y="300" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">PTE → PFN</text>

  <!-- Refill TLB -->
  <path d="M382 311 H340 V340 H170 V320" fill="none" stroke="#f97316" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="220" y="356" fill="#c2410c" font-size="11" font-weight="700">miss 后回填 TLB</text>

  <!-- Legend -->
  <rect x="40" y="455" width="840" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <line x1="60" y1="477" x2="100" y2="477" stroke="#10b981" stroke-width="2.2"/>
  <text x="108" y="481" fill="#334155" font-size="11">TLB 命中</text>

  <line x1="230" y1="477" x2="270" y2="477" stroke="#ef4444" stroke-width="2"/>
  <text x="278" y="481" fill="#334155" font-size="11">TLB miss → 页表遍历</text>

  <line x1="470" y1="477" x2="510" y2="477" stroke="#8b5cf6" stroke-width="2"/>
  <text x="518" y="481" fill="#334155" font-size="11">页表 → 物理内存</text>

  <line x1="680" y1="477" x2="720" y2="477" stroke="#f97316" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="728" y="481" fill="#334155" font-size="11">miss 后回填 TLB</text>
</svg>