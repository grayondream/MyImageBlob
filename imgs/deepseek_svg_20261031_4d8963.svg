<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="264" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="34" font-size="13" font-weight="bold" fill="#333">Op Cache miss 84% → 99%，分发速率纹丝不动：后端才是瓶颈</text>

  <!-- 图例说明 -->
  <text x="140" y="50" font-size="10" fill="#2e7d32">v1–v3：Op Cache 命中</text>
  <text x="560" y="50" font-size="10" fill="#c62828">v4–v5：Op Cache 溢出</text>

  <!-- 绘图区背景 -->
  <rect x="70" y="60" width="650" height="170" fill="#f5f5f5"/>

  <!-- 水平网格 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="70" y1="205.7" x2="720" y2="205.7"/>
    <line x1="70" y1="181.4" x2="720" y2="181.4"/>
    <line x1="70" y1="157.1" x2="720" y2="157.1"/>
    <line x1="70" y1="108.6" x2="720" y2="108.6"/>
  </g>

  <!-- 参考线 -->
  <line x1="70" y1="132.9" x2="720" y2="132.9" stroke="#999" stroke-dasharray="3,3"/>
  <text x="76" y="128" font-size="9" fill="#999">4-wide 解码器上限</text>

  <line x1="70" y1="84.3" x2="720" y2="84.3" stroke="#4527a0" stroke-dasharray="3,3"/>
  <text x="76" y="80" font-size="9" fill="#4527a0">6-wide dispatch 上限</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="230" x2="720" y2="230" stroke="#333"/>
  <line x1="70" y1="230" x2="70" y2="60" stroke="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="64" y="233">0</text>
    <text x="64" y="184.4">2</text>
    <text x="64" y="135.9">4</text>
    <text x="64" y="87.3">6</text>
  </g>

  <!-- 轴标题 -->
  <text x="395" y="268" font-size="10" fill="#555" text-anchor="middle">版本 →</text>
  <text x="20" y="150" font-size="10" fill="#555" transform="rotate(-90 20,150)">cop / cycle</text>

  <!-- v1：3.24 -->
  <g>
    <rect x="140" y="151.31" width="40" height="78.69" fill="#1565c0"/>
    <text x="160" y="146.31" font-size="10" fill="#1565c0" font-weight="bold" text-anchor="middle">3.24</text>
    <text x="160" y="248" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v1</text>
  </g>

  <!-- v2：3.20 -->
  <g>
    <rect x="280" y="152.29" width="40" height="77.71" fill="#1565c0"/>
    <text x="300" y="147.29" font-size="10" fill="#1565c0" font-weight="bold" text-anchor="middle">3.20</text>
    <text x="300" y="248" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v2</text>
  </g>

  <!-- v3：3.18 -->
  <g>
    <rect x="420" y="152.77" width="40" height="77.23" fill="#1565c0"/>
    <text x="440" y="147.77" font-size="10" fill="#1565c0" font-weight="bold" text-anchor="middle">3.18</text>
    <text x="440" y="248" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v3</text>
  </g>

  <!-- v4：3.18 -->
  <g>
    <rect x="560" y="152.77" width="40" height="77.23" fill="#c62828"/>
    <text x="580" y="147.77" font-size="10" fill="#c62828" font-weight="bold" text-anchor="middle">3.18</text>
    <text x="580" y="248" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v4</text>
  </g>

  <!-- v5：3.18 -->
  <g>
    <rect x="680" y="152.77" width="40" height="77.23" fill="#c62828"/>
    <text x="700" y="147.77" font-size="10" fill="#c62828" font-weight="bold" text-anchor="middle">3.18</text>
    <text x="700" y="248" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v5</text>
  </g>
</svg>