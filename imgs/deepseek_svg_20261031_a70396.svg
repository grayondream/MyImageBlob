<svg width="760" height="270" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="254" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">实验 B：伪共享把每次递增拖到 27 倍</text>
  <text x="30" y="48" font-size="9" fill="#666">柱高按总时间 0–700 ms 线性比例绘制；v1 653 ms，v2 23.9 ms</text>

  <!-- 绘图区背景 -->
  <rect x="70" y="58" width="650" height="167" fill="#f5f5f5"/>

  <!-- 水平网格：0–700 ms，每 100 ms -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="70" y1="201.1" x2="720" y2="201.1"/>
    <line x1="70" y1="177.3" x2="720" y2="177.3"/>
    <line x1="70" y1="153.4" x2="720" y2="153.4"/>
    <line x1="70" y1="129.6" x2="720" y2="129.6"/>
    <line x1="70" y1="105.7" x2="720" y2="105.7"/>
    <line x1="70" y1="81.9" x2="720" y2="81.9"/>
    <line x1="70" y1="58" x2="720" y2="58"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="70" y1="225" x2="720" y2="225" stroke="#333"/>
  <line x1="70" y1="225" x2="70" y2="58" stroke="#333"/>
  <polygon points="720,225 714,222 714,228" fill="#333"/>
  <polygon points="70,58 67,64 73,64" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="64" y="228">0</text>
    <text x="64" y="204.1">100</text>
    <text x="64" y="180.3">200</text>
    <text x="64" y="156.4">300</text>
    <text x="64" y="132.6">400</text>
    <text x="64" y="108.7">500</text>
    <text x="64" y="84.9">600</text>
    <text x="64" y="61">700</text>
  </g>

  <!-- v1 伪共享：653 ms -->
  <g>
    <rect x="160" y="69.2" width="120" height="155.8" fill="#c62828"/>
    <text x="220" y="63.2" font-size="13" font-weight="bold" fill="#c62828" text-anchor="middle">653 ms</text>
    <text x="220" y="203" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">3.27 ns/inc</text>
    <text x="220" y="245" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v1 伪共享</text>
  </g>

  <!-- v2 填充：23.9 ms -->
  <g>
    <rect x="420" y="219.3" width="120" height="5.7" fill="#2e7d32"/>
    <text x="480" y="213.3" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">23.9 ms</text>
    <text x="480" y="200" font-size="9" fill="#2e7d32" text-anchor="middle">0.12 ns/inc</text>
    <text x="480" y="245" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v2 填充</text>
  </g>

  <!-- 差距箭头 -->
  <line x1="290" y1="150" x2="400" y2="150" stroke="#888" stroke-width="2"/>
  <polygon points="400,150 390,144 390,156" fill="#888"/>
  <text x="345" y="140" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">27.3×</text>

  <!-- 轴标题 -->
  <text x="20" y="150" font-size="10" fill="#555" transform="rotate(-90 20,150)">时间 / ms</text>
</svg>