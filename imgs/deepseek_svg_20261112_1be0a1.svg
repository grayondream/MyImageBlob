 <title id="chartTitle">图 14　B：Theoretical 100% 对照（实测 device 76.99% / 62.60%）时 1 链与 4 链几乎相同；16.7% occupancy 时 4 链把 0.209 ms 降到 0.140 ms（1.49×）。</title>
