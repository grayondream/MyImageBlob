<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="g4k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="g2m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="920" height="560" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="460" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    图 11　fork + COW：THP 降低页表复制成本，但抬高首次写延迟
  </text>

  <!-- ==================== 左卡片：fork() 耗时 ==================== -->
  <rect x="40" y="70" width="420" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="250" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">fork() 耗时（512 MiB 区域）</text>

  <!-- Y 轴 -->
  <text x="60" y="318" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90 60 318)">ms</text>

  <!-- 网格 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="222" x2="440" y2="222"/>
    <line x1="100" y1="316" x2="440" y2="316"/>
    <line x1="100" y1="410" x2="440" y2="410"/>
  </g>

  <!-- Y 轴刻度 -->
  <g text-anchor="end" font-size="11" fill="#64748b">
    <text x="92" y="226">10</text>
    <text x="92" y="320">5</text>
    <text x="92" y="414">0</text>
  </g>

  <!-- 基线 -->
  <line x1="100" y1="410" x2="440" y2="410" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 4 KB 柱 -->
  <path d="M149,212 Q149,206 155,206 L219,206 Q225,206 225,212 L225,410 L149,410 Z" fill="url(#g4k)"/>
  <text x="187" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">10.86 ms</text>

  <!-- 2 MB 柱（极矮，示意） -->
  <rect x="299" y="404.4" width="76" height="5.6" rx="2" fill="url(#g2m)"/>
  <line x1="337" y1="382" x2="337" y2="402" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="337" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">0.30 ms</text>

  <!-- 类别标签 -->
  <text x="187" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">4 KB</text>
  <text x="337" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">2 MB THP</text>

  <!-- 36× 徽章 -->
  <rect x="205" y="150" width="90" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="250" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">THP 快 36×</text>

  <!-- ==================== 右卡片：COW 首次写延迟 ==================== -->
  <rect x="480" y="70" width="400" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="680" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">COW 首次写延迟（每 2 MB 写 1 字节）</text>

  <!-- Y 轴 -->
  <text x="500" y="288" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90 500 288)">µs</text>

  <!-- 网格 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="535" y1="166" x2="860" y2="166"/>
    <line x1="535" y1="288" x2="860" y2="288"/>
    <line x1="535" y1="410" x2="860" y2="410"/>
  </g>

  <!-- Y 轴刻度 -->
  <g text-anchor="end" font-size="11" fill="#64748b">
    <text x="528" y="170">20</text>
    <text x="528" y="292">10</text>
    <text x="528" y="414">0</text>
  </g>

  <!-- 基线 -->
  <line x1="535" y1="410" x2="860" y2="410" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 4 KB p50 -->
  <rect x="560" y="378.28" width="40" height="31.72" rx="4" fill="#fca5a5"/>
  <text x="580" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">2.6</text>

  <!-- 4 KB p99 -->
  <rect x="605" y="336.8" width="40" height="73.2" rx="4" fill="#ef4444"/>
  <text x="625" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">6.0</text>

  <!-- 2 MB p50 -->
  <rect x="720" y="297.76" width="40" height="112.24" rx="4" fill="#6ee7b7"/>
  <text x="740" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">9.2</text>

  <!-- 2 MB p99 -->
  <rect x="765" y="213.58" width="40" height="196.42" rx="4" fill="#10b981"/>
  <text x="785" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">16.1</text>

  <!-- 类别标签 -->
  <text x="602" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">4 KB</text>
  <text x="762" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">2 MB THP</text>

  <!-- 标注 -->
  <text x="680" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">p50 慢 3.5× · 复制粒度 4 KB/次</text>

  <!-- 图例色块 -->
  <rect x="590" y="152" width="14" height="14" rx="3" fill="#fca5a5"/>
  <text x="610" y="163" font-size="10.5" fill="#64748b">p50</text>
  <rect x="650" y="152" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="670" y="163" font-size="10.5" fill="#64748b">p99</text>
  <rect x="710" y="152" width="14" height="14" rx="3" fill="#6ee7b7"/>
  <text x="730" y="163" font-size="10.5" fill="#64748b">p50</text>
  <rect x="770" y="152" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="790" y="163" font-size="10.5" fill="#64748b">p99</text>

  <!-- ==================== 脚注 ==================== -->
  <text x="60" y="490" font-size="10.5" fill="#94a3b8">
    本机内核在 COW 时先拆分大页、再按 4 KB 复制：Private_Dirty 增量 1.0 MiB / 256 次写。
  </text>
  <text x="60" y="512" font-size="10" fill="#94a3b8">
    512 MiB 匿名区域，父进程逐 4 KB 触碰后 fork；子进程在每个 2 MB 边界写 1 字节。fork 计时为父进程 fork() 返回耗时。
  </text>
</svg>