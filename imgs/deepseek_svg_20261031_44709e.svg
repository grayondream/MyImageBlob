<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="304" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">5600X 单核 Roofline：斜坡 18 GB/s，峰值 37 GFLOP/s，拐点 AI≈2</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="205" fill="#f5f5f5"/>

  <!-- y 轴对数网格：5 / 10 / 20 / 40 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="140" x2="720" y2="140"/>
    <line x1="80" y1="100" x2="720" y2="100"/>
  </g>
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="223">5</text>
    <text x="74" y="183">10</text>
    <text x="74" y="143">20</text>
    <text x="74" y="103">40</text>
  </g>

  <!-- 顶部区域标签 -->
  <rect x="88" y="60" width="108" height="18" fill="#e3f2fd"/>
  <text x="94" y="73" font-size="9" fill="#1565c0" font-weight="bold">内存受限斜坡</text>
  <rect x="420" y="60" width="170" height="18" fill="#fff3e0"/>
  <text x="426" y="73" font-size="9" fill="#ef6c00" font-weight="bold">计算受限（随 K 缓慢下降）</text>

  <!-- Roofline：斜坡 + 峰值平台 -->
  <line x1="80" y1="260" x2="200" y2="100" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="200" y1="100" x2="720" y2="100" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- 标注 -->
  <text x="94" y="226" font-size="9" fill="#1565c0" font-weight="bold">斜坡 18 GB/s</text>
  <text x="612" y="92" font-size="10" fill="#2e7d32" font-weight="bold">~37 GFLOP/s</text>

  <!-- 拐点 -->
  <line x1="200" y1="260" x2="200" y2="100" stroke="#c62828" stroke-dasharray="4,3"/>
  <text x="200" y="80" font-size="10" fill="#c62828" font-weight="bold" text-anchor="middle">拐点 AI≈2</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#333"/>
  <line x1="80" y1="260" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,260 714,257 714,263" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- 数据点 -->
  <circle cx="105" cy="252" r="5" fill="#1565c0"/>
  <circle cx="152" cy="245" r="5" fill="#1565c0"/>
  <circle cx="245" cy="222" r="5" fill="#1565c0"/>
  <circle cx="340" cy="180" r="5" fill="#ef6c00"/>
  <circle cx="435" cy="110" r="6" fill="#2e7d32"/>
  <circle cx="530" cy="127" r="5" fill="#ef6c00"/>
  <circle cx="625" cy="154" r="5" fill="#ef6c00"/>
  <circle cx="720" cy="174" r="5" fill="#ef6c00"/>

  <!-- 数据点标签 -->
  <text x="96" y="246" font-size="9" fill="#333">K=1</text>
  <text x="142" y="239" font-size="9" fill="#333">K=2</text>
  <text x="230" y="216" font-size="9" fill="#333">K=4</text>
  <text x="322" y="173" font-size="9" fill="#333">K=8</text>
  <text x="420" y="103" font-size="9" fill="#333">K=16</text>
  <text x="513" y="120" font-size="9" fill="#333">K=32</text>
  <text x="610" y="147" font-size="9" fill="#333">K=64</text>
  <text x="700" y="168" font-size="9" fill="#333">K=128</text>

  <!-- 轴标题 -->
  <text x="380" y="300" font-size="10" fill="#555" text-anchor="middle">算术强度 AI（FLOP/Byte）→</text>
  <text x="20" y="160" font-size="10" fill="#555" transform="rotate(-90 20,160)">GFLOP/s</text>

  <!-- 说明 -->
  <text x="30" y="318" font-size="9" fill="#666">斜坡对应 18 GB/s；峰值平台约 37 GFLOP/s；拐点位于 AI≈2。数据点为不同 K 下的实测/示意值。</text>
</svg>