<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="800" fill="#ffffff"/>

  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">2.5 打包（Packing）：把子块复制成连续面板</text>

  <!-- 左侧：打包前 -->
  <text x="240" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">打包前：原始矩阵中的子块</text>

  <g transform="translate(50, 90)">
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">A（M×K，行主序）</text>
    <rect x="0" y="0" width="180" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="120" x2="180" y2="120" stroke="#93c5fd" stroke-width="0.6"/>
    <rect x="90" y="60" width="30" height="30" fill="#3b82f6" fill-opacity="0.5" rx="1"/>
    <text x="105" y="80" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="bold">A[i,p]</text>
    <line x1="10" y1="150" x2="170" y2="150" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrBlue)"/>
    <text x="90" y="165" text-anchor="middle" font-size="10" fill="#2563eb">行内连续，行间大步长</text>
  </g>

  <g transform="translate(270, 90)">
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">B（K×N，行主序）</text>
    <rect x="0" y="0" width="180" height="150" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="120" x2="180" y2="120" stroke="#fcd34d" stroke-width="0.6"/>
    <rect x="0" y="60" width="180" height="30" fill="#f59e0b" fill-opacity="0.4" rx="1"/>
    <text x="160" y="80" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">B[p,:]</text>
    <line x1="10" y1="150" x2="170" y2="150" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrOrange)"/>
    <text x="90" y="165" text-anchor="middle" font-size="10" fill="#d97706">行内连续，行间大步长</text>
  </g>

  <g transform="translate(470, 130)">
    <line x1="0" y1="40" x2="50" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="25" y="30" text-anchor="middle" font-size="11" fill="#64748b" font-weight="bold">打包</text>
  </g>

  <!-- 右侧：打包后 -->
  <text x="720" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">打包后：连续缓冲区</text>

  <g transform="translate(530, 90)">
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Ap（MC×KC，连续）</text>
    <rect x="0" y="0" width="180" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="0" y1="120" x2="180" y2="120" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="30" y1="0" x2="30" y2="150" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="60" y1="0" x2="60" y2="150" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="90" y1="0" x2="90" y2="150" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="120" y1="0" x2="120" y2="150" stroke="#93c5fd" stroke-width="0.6"/>
    <line x1="150" y1="0" x2="150" y2="150" stroke="#93c5fd" stroke-width="0.6"/>
    <rect x="90" y="60" width="30" height="30" fill="#3b82f6" fill-opacity="0.5" rx="1"/>
    <text x="105" y="80" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="bold">Ap</text>
    <line x1="10" y1="150" x2="170" y2="150" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrBlue)"/>
    <text x="90" y="165" text-anchor="middle" font-size="10" fill="#2563eb">行间步长 = kc（紧凑）</text>
  </g>

  <g transform="translate(750, 90)">
    <text x="90" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">Bp（KC×NC，连续）</text>
    <rect x="0" y="0" width="180" height="150" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="0" y1="120" x2="180" y2="120" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="30" y1="0" x2="30" y2="150" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="60" y1="0" x2="60" y2="150" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="90" y1="0" x2="90" y2="150" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="120" y1="0" x2="120" y2="150" stroke="#fcd34d" stroke-width="0.6"/>
    <line x1="150" y1="0" x2="150" y2="150" stroke="#fcd34d" stroke-width="0.6"/>
    <rect x="0" y="60" width="180" height="30" fill="#f59e0b" fill-opacity="0.45" rx="1"/>
    <text x="160" y="80" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">Bp[p,:]</text>
    <line x1="10" y1="150" x2="170" y2="150" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrOrange)"/>
    <text x="90" y="165" text-anchor="middle" font-size="10" fill="#d97706">整行连续，步长 = n（紧凑）</text>
  </g>

  <!-- 分隔线 -->
  <line x1="40" y1="290" x2="920" y2="290" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- 左侧：循环结构 -->
  <g transform="translate(40, 320)">
    <text x="230" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">循环结构：打包 + 计算</text>

    <rect x="0" y="20" width="460" height="400" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="6"/>
    <text x="10" y="42" font-size="12" fill="#166534" font-weight="bold">for jc（N 维分块）</text>

    <rect x="20" y="55" width="420" height="350" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" rx="4"/>
    <text x="30" y="77" font-size="12" fill="#92400e" font-weight="bold">for pc（K 维分块）</text>

    <rect x="40" y="90" width="380" height="48" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" rx="4"/>
    <text x="50" y="110" font-size="11" fill="#92400e" font-weight="bold">打包 B：Bp[p,j] = B[(pc+p)*N + jc + j]</text>
    <text x="50" y="128" font-size="10" fill="#b45309">KC×NC 子块 → 连续面板</text>

    <rect x="40" y="148" width="380" height="245" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" rx="4"/>
    <text x="50" y="170" font-size="12" fill="#1e40af" font-weight="bold">for ic（M 维分块）</text>

    <rect x="60" y="182" width="340" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" rx="4"/>
    <text x="70" y="202" font-size="11" fill="#1e40af" font-weight="bold">打包 A：Ap[i,p] = A[(ic+i)*K + pc + p]</text>
    <text x="70" y="220" font-size="10" fill="#2563eb">MC×KC 子块 → 连续面板</text>

    <rect x="60" y="240" width="340" height="145" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1" rx="4"/>
    <text x="70" y="262" font-size="11" fill="#3730a3" font-weight="bold">for i（行）</text>

    <rect x="80" y="275" width="300" height="100" fill="#c7d2fe" stroke="#818cf8" stroke-width="1" rx="4"/>
    <text x="90" y="297" font-size="11" fill="#312e81" font-weight="bold">for p（K 维）</text>

    <rect x="100" y="310" width="260" height="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8" rx="3"/>
    <text x="230" y="326" text-anchor="middle" font-size="10" fill="#1e40af">a = Ap[i*kc + p]  ← 连续读取</text>

    <rect x="100" y="340" width="260" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="0.8" rx="3"/>
    <text x="230" y="357" text-anchor="middle" font-size="10" fill="#92400e">C[i,j] += a * Bp[p*n + j]  ← 整行连续</text>
  </g>

  <!-- 右侧：内存布局对比 -->
  <g transform="translate(530, 320)">
    <rect x="0" y="0" width="400" height="400" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">打包前后的内存访问</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-size="12" fill="#dc2626" font-weight="bold">打包前：大步长，缓存行浪费</text>
      <rect x="0" y="15" width="360" height="70" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="4"/>
      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="80" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="0.8" rx="2"/>
        <text x="40" y="14" text-anchor="middle" font-size="9" fill="#991b1b">缓存行</text>
        <rect x="90" y="0" width="80" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="0.8" rx="2"/>
        <text x="130" y="14" text-anchor="middle" font-size="9" fill="#991b1b">缓存行</text>
        <rect x="180" y="0" width="80" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="0.8" rx="2"/>
        <text x="220" y="14" text-anchor="middle" font-size="9" fill="#991b1b">缓存行</text>
        <rect x="270" y="0" width="80" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="0.8" rx="2"/>
        <text x="310" y="14" text-anchor="middle" font-size="9" fill="#991b1b">缓存行</text>
      </g>
      <text x="180" y="72" text-anchor="middle" font-size="10" fill="#dc2626">B[p,:] 跨行访问，每次只用一个元素</text>
    </g>

    <g transform="translate(20, 145)">
      <text x="0" y="0" font-size="12" fill="#16a34a" font-weight="bold">打包后：连续访问，缓存行充分利用</text>
      <rect x="0" y="15" width="360" height="70" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="4"/>
      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="340" height="20" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.8" rx="2"/>
        <text x="170" y="14" text-anchor="middle" font-size="9" fill="#166534">Bp 连续面板：一行紧接一行，无空隙</text>
      </g>
      <text x="180" y="72" text-anchor="middle" font-size="10" fill="#16a34a">连续读取，硬件预取器高效工作</text>
    </g>

    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="360" height="145" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2" rx="4"/>
      <text x="180" y="22" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="bold">打包带来的收益</text>
      <text x="15" y="48" font-size="11" fill="#0c4a6e">• 消除大步长访问</text>
      <text x="15" y="70" font-size="11" fill="#0c4a6e">• 降低 TLB 压力</text>
      <text x="15" y="92" font-size="11" fill="#0c4a6e">• 硬件预取器准确识别模式</text>
      <text x="15" y="114" font-size="11" fill="#0c4a6e">• SIMD 加载更高效</text>
      <text x="15" y="136" font-size="10" fill="#16a34a">→ 微内核内层每次都能取到连续内存</text>
    </g>
  </g>

  <!-- 底部结论 -->
  <g transform="translate(40, 740)">
    <rect x="0" y="0" width="880" height="50" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="6"/>
    <text x="440" y="20" text-anchor="middle" font-size="11" fill="#dc2626">遗留问题：内层仍每次只做一个标量与一行的乘加，FMA 发射效率还有提升空间 → 需要寄存器分块与微内核</text>
    <text x="440" y="40" text-anchor="middle" font-size="11" fill="#16a34a">下一步：把 C 的小块放进寄存器，用多个独立累加器填满 FMA 流水线</text>
  </g>
</svg>