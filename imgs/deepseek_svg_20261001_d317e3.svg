<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="820" fill="#ffffff"/>

  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">2.8 多线程与 NUMA：OpenMP 并行化</text>

  <!-- ==================== 上半部分：多线程并行模型 ==================== -->
  <text x="480" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">OpenMP 并行区域：线程各自处理不同的 jc 块</text>

  <!-- 线程 0 -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="210" height="130" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="105" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">线程 0</text>
    <line x1="15" y1="32" x2="195" y2="32" stroke="#93c5fd" stroke-width="1"/>
    <text x="15" y="52" font-size="10" fill="#1e40af">Ap = malloc(MC*KC)</text>
    <text x="15" y="70" font-size="10" fill="#1e40af">Bp = malloc(KC*NC)</text>
    <text x="15" y="95" font-size="10" fill="#2563eb">处理 jc = 0 .. NC-1</text>
    <text x="15" y="115" font-size="10" fill="#64748b">私有缓冲区，无数据竞争</text>
  </g>

  <!-- 线程 1 -->
  <g transform="translate(270, 95)">
    <rect x="0" y="0" width="210" height="130" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
    <text x="105" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">线程 1</text>
    <line x1="15" y1="32" x2="195" y2="32" stroke="#86efac" stroke-width="1"/>
    <text x="15" y="52" font-size="10" fill="#166534">Ap = malloc(MC*KC)</text>
    <text x="15" y="70" font-size="10" fill="#166534">Bp = malloc(KC*NC)</text>
    <text x="15" y="95" font-size="10" fill="#16a34a">处理 jc = NC .. 2NC-1</text>
    <text x="15" y="115" font-size="10" fill="#64748b">私有缓冲区，无数据竞争</text>
  </g>

  <!-- 线程 2 -->
  <g transform="translate(500, 95)">
    <rect x="0" y="0" width="210" height="130" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="6"/>
    <text x="105" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">线程 2</text>
    <line x1="15" y1="32" x2="195" y2="32" stroke="#fcd34d" stroke-width="1"/>
    <text x="15" y="52" font-size="10" fill="#92400e">Ap = malloc(MC*KC)</text>
    <text x="15" y="70" font-size="10" fill="#92400e">Bp = malloc(KC*NC)</text>
    <text x="15" y="95" font-size="10" fill="#d97706">处理 jc = 2NC .. 3NC-1</text>
    <text x="15" y="115" font-size="10" fill="#64748b">私有缓冲区，无数据竞争</text>
  </g>

  <!-- 线程 3 -->
  <g transform="translate(730, 95)">
    <rect x="0" y="0" width="190" height="130" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" rx="6"/>
    <text x="95" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">线程 3</text>
    <line x1="15" y1="32" x2="175" y2="32" stroke="#f9a8d4" stroke-width="1"/>
    <text x="15" y="52" font-size="10" fill="#9d174d">Ap = malloc(MC*KC)</text>
    <text x="15" y="70" font-size="10" fill="#9d174d">Bp = malloc(KC*NC)</text>
    <text x="15" y="95" font-size="10" fill="#db2777">处理 jc = 3NC ..</text>
    <text x="15" y="115" font-size="10" fill="#64748b">私有缓冲区</text>
  </g>

  <!-- 并行区域说明 -->
  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="880" height="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
    <text x="440" y="20" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">#pragma omp parallel</text>
    <text x="440" y="38" text-anchor="middle" font-size="11" fill="#64748b">每个线程独立分配 Ap、Bp，独立执行分块循环，共享只读的 A、B 和可写的 C 的不同区域</text>
  </g>

  <!-- 分隔线 -->
  <line x1="40" y1="310" x2="920" y2="310" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- ==================== 下半部分：单线程内部循环 ==================== -->
  <text x="480" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">单个线程内部：分块循环 + 打包 + 微内核</text>

  <!-- 左侧：循环结构 -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="440" height="400" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="6"/>

    <!-- jc 循环 -->
    <text x="10" y="25" font-size="12" font-weight="bold" fill="#166534">#pragma omp for schedule(dynamic)</text>
    <text x="10" y="42" font-size="11" fill="#166534">for jc = 0; jc &lt; N; jc += NC</text>

    <!-- pc 循环 -->
    <rect x="20" y="55" width="400" height="330" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" rx="4"/>
    <text x="30" y="77" font-size="12" font-weight="bold" fill="#92400e">for pc = 0; pc &lt; K; pc += KC</text>

    <!-- 打包 B -->
    <rect x="40" y="92" width="360" height="45" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="3"/>
    <text x="50" y="112" font-size="11" fill="#92400e" font-weight="bold">打包 B：Bp[p,j] = B[(pc+p)*N + jc + j]</text>
    <text x="50" y="128" font-size="10" fill="#b45309">KC×NC 子块 → 连续面板（线程私有）</text>

    <!-- ic 循环 -->
    <rect x="40" y="148" width="360" height="230" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" rx="4"/>
    <text x="50" y="170" font-size="12" font-weight="bold" fill="#1e40af">for ic = 0; ic &lt; M; ic += MC</text>

    <!-- 打包 A -->
    <rect x="60" y="185" width="320" height="45" fill="#dbeafe" stroke="#2563eb" stroke-width="1" rx="3"/>
    <text x="70" y="205" font-size="11" fill="#1e40af" font-weight="bold">打包 A：Ap[i,p] = A[(ic+i)*K + pc + p]</text>
    <text x="70" y="221" font-size="10" fill="#2563eb">MC×KC 子块 → 连续面板（线程私有）</text>

    <!-- 微内核调用 -->
    <rect x="60" y="240" width="320" height="125" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2" rx="3"/>
    <text x="70" y="262" font-size="11" fill="#3730a3" font-weight="bold">for ir += MR, jr += NR</text>
    <text x="70" y="282" font-size="10" fill="#4338ca">micro_kernel_avx2(kc, n,</text>
    <text x="70" y="298" font-size="10" fill="#4338ca">                   Ap + ir*kc,</text>
    <text x="70" y="314" font-size="10" fill="#4338ca">                   Bp + jr,</text>
    <text x="70" y="330" font-size="10" fill="#4338ca">                   C + (ic+ir)*N + (jc+jr), N)</text>
    <text x="70" y="352" font-size="10" fill="#dc2626">边角：MR/NR 不整除的部分单独处理</text>
  </g>

  <!-- 右侧：线程私有缓冲区与共享数据 -->
  <g transform="translate(510, 370)">
    <rect x="0" y="0" width="410" height="400" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
    <text x="205" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">数据共享与私有</text>
    <line x1="20" y1="38" x2="390" y2="38" stroke="#cbd5e1" stroke-width="1"/>

    <!-- 共享只读 -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="370" height="70" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" rx="4"/>
      <text x="15" y="22" font-size="12" font-weight="bold" fill="#1e40af">共享只读：A、B</text>
      <text x="15" y="45" font-size="10" fill="#2563eb">所有线程读取相同的 A、B 矩阵</text>
      <text x="15" y="62" font-size="10" fill="#2563eb">只读访问，无数据竞争</text>
    </g>

    <!-- 共享可写 -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="370" height="70" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="4"/>
      <text x="15" y="22" font-size="12" font-weight="bold" fill="#166534">共享可写：C</text>
      <text x="15" y="45" font-size="10" fill="#16a34a">不同线程写入 C 的不同 jc 列块</text>
      <text x="15" y="62" font-size="10" fill="#16a34a">无重叠区域，无伪共享</text>
    </g>

    <!-- 线程私有 -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="370" height="70" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" rx="4"/>
      <text x="15" y="22" font-size="12" font-weight="bold" fill="#92400e">线程私有：Ap、Bp</text>
      <text x="15" y="45" font-size="10" fill="#d97706">每个线程独立 malloc 自己的 Ap、Bp</text>
      <text x="15" y="62" font-size="10" fill="#d97706">避免线程间写冲突</text>
    </g>

    <!-- 负载均衡 -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="370" height="70" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2" rx="4"/>
      <text x="15" y="22" font-size="12" font-weight="bold" fill="#0369a1">schedule(dynamic)</text>
      <text x="15" y="45" font-size="10" fill="#0c4a6e">动态分配 jc 块，负载均衡</text>
      <text x="15" y="62" font-size="10" fill="#0c4a6e">避免线程间工作量不均</text>
    </g>
  </g>

  <!-- 底部结论 -->
  <g transform="translate(40, 785)">
    <rect x="0" y="0" width="880" height="30" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="6"/>
    <text x="440" y="20" text-anchor="middle" font-size="11" fill="#16a34a">多线程 + SIMD 微内核：突破单核算力限制，逼近共享 L3 和内存带宽上限</text>
  </g>
</svg>