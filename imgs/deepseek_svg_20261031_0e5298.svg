<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="324" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="34" font-size="13" font-weight="bold" fill="#333">四个版本三个比值：只有 v2 和 v4 落入设计意图的桶</text>

  <!-- 图例 -->
  <g transform="translate(500,25)">
    <rect x="0" y="0" width="12" height="12" fill="#1565c0"/>
    <text x="18" y="11" font-size="10" fill="#333">cache-miss %</text>
    <rect x="110" y="0" width="12" height="12" fill="#c62828"/>
    <text x="128" y="11" font-size="10" fill="#333">brn-misp %</text>
    <rect x="220" y="0" width="12" height="12" fill="#ef6c00"/>
    <text x="238" y="11" font-size="10" fill="#333">op_cache-miss %</text>
  </g>

  <!-- 绘图区背景 -->
  <rect x="70" y="55" width="650" height="215" fill="#f5f5f5"/>

  <!-- 参考线：50% / 80% -->
  <line x1="70" y1="170" x2="720" y2="170" stroke="#999" stroke-dasharray="3,3"/>
  <text x="690" y="166" font-size="9" fill="#999">50%</text>
  <line x1="70" y1="110" x2="720" y2="110" stroke="#999" stroke-dasharray="3,3"/>
  <text x="690" y="106" font-size="9" fill="#999">80%</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="270" x2="720" y2="270" stroke="#333"/>
  <line x1="70" y1="270" x2="70" y2="55" stroke="#333"/>

  <text x="380" y="305" font-size="10" fill="#555" text-anchor="middle">版本 →</text>
  <text x="22" y="165" font-size="10" fill="#555" transform="rotate(-90 22,165)">比值</text>

  <!-- v1：三个约 10%，原图未标具体值 -->
  <g transform="translate(130,0)">
    <rect x="0" y="250" width="25" height="20" fill="#1565c0"/>
    <rect x="30" y="250" width="25" height="20" fill="#c62828"/>
    <rect x="60" y="250" width="25" height="20" fill="#ef6c00"/>
    <text x="18" y="285" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v1</text>
    <text x="50" y="238" font-size="9" fill="#c62828" font-weight="bold" text-anchor="middle">失效</text>
  </g>

  <!-- v2：47% / 9% / 20% -->
  <g transform="translate(280,0)">
    <rect x="0" y="176" width="25" height="94" fill="#1565c0"/>
    <rect x="30" y="252" width="25" height="18" fill="#c62828"/>
    <rect x="60" y="230" width="25" height="40" fill="#ef6c00"/>
    <text x="0" y="171" font-size="9" fill="#1565c0" font-weight="bold">47%</text>
    <text x="65" y="225" font-size="9" fill="#ef6c00" font-weight="bold">20%</text>
    <text x="18" y="285" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v2</text>
    <text x="48" y="238" font-size="9" fill="#2e7d32" font-weight="bold" text-anchor="middle">✅ Mem</text>
  </g>

  <!-- v3：7% / 7.9% / 7% -->
  <g transform="translate(430,0)">
    <rect x="0" y="256" width="25" height="14" fill="#1565c0"/>
    <rect x="30" y="254.2" width="25" height="15.8" fill="#c62828"/>
    <rect x="60" y="256" width="25" height="14" fill="#ef6c00"/>
    <text x="0" y="251" font-size="9" fill="#1565c0" font-weight="bold">7%</text>
    <text x="33" y="249" font-size="9" fill="#c62828" font-weight="bold">7.9%</text>
    <text x="18" y="285" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v3</text>
    <text x="48" y="238" font-size="9" fill="#c62828" font-weight="bold" text-anchor="middle">失效</text>
  </g>

  <!-- v4：2.5% / 8% / 84% -->
  <g transform="translate(580,0)">
    <rect x="0" y="265" width="25" height="5" fill="#1565c0"/>
    <rect x="30" y="254" width="25" height="16" fill="#c62828"/>
    <rect x="60" y="102" width="25" height="168" fill="#ef6c00"/>
    <text x="0" y="260" font-size="9" fill="#1565c0" font-weight="bold">2.5%</text>
    <text x="33" y="249" font-size="9" fill="#c62828" font-weight="bold">8%</text>
    <text x="60" y="97" font-size="9" fill="#ef6c00" font-weight="bold">84%</text>
    <text x="18" y="285" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">v4</text>
    <text x="40" y="238" font-size="9" fill="#2e7d32" font-weight="bold" text-anchor="middle">✅ FE</text>
  </g>
</svg>