<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="264" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">温度降 9.6°C，吞吐只涨 1.87%：频率已触 boost 上限</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="160" fill="#f5f5f5"/>

  <!-- 水平网格：240–360，每 20 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="188.3" x2="720" y2="188.3"/>
    <line x1="80" y1="161.7" x2="720" y2="161.7"/>
    <line x1="80" y1="135" x2="720" y2="135"/>
    <line x1="80" y1="108.3" x2="720" y2="108.3"/>
    <line x1="80" y1="81.7" x2="720" y2="81.7"/>
  </g>

  <!-- 333 参考线 -->
  <line x1="80" y1="90" x2="720" y2="90" stroke="#999" stroke-dasharray="3,3"/>
  <text x="686" y="86" font-size="9" fill="#999">333</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="215" x2="720" y2="215" stroke="#333"/>
  <line x1="80" y1="215" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,215 714,212 714,218" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="218">240</text>
    <text x="74" y="191.3">260</text>
    <text x="74" y="164.7">280</text>
    <text x="74" y="138">300</text>
    <text x="74" y="111.3">320</text>
    <text x="74" y="84.7">340</text>
    <text x="74" y="58">360</text>
  </g>

  <!-- 默认 BIOS 折线 -->
  <polyline points="160,178 245,173 330,166 415,164 500,143 585,120 670,108 710,105"
            fill="none" stroke="#1565c0" stroke-width="3"/>
  <g fill="#1565c0">
    <circle cx="160" cy="178" r="4"/>
    <circle cx="245" cy="173" r="4"/>
    <circle cx="330" cy="166" r="4"/>
    <circle cx="415" cy="164" r="4"/>
    <circle cx="500" cy="143" r="4"/>
    <circle cx="585" cy="120" r="4"/>
    <circle cx="670" cy="108" r="4"/>
    <circle cx="710" cy="105" r="4"/>
  </g>

  <!-- CO -20 折线 -->
  <polyline points="160,177 245,172 330,164 415,148 500,132 585,107 670,98 710,97"
            fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="7,4"/>
  <g fill="#2e7d32">
    <circle cx="160" cy="177" r="4"/>
    <circle cx="710" cy="97" r="4"/>
  </g>

  <!-- 图例 -->
  <g font-size="11" font-weight="bold">
    <rect x="90" y="62" width="12" height="12" fill="#1565c0"/>
    <text x="108" y="72" fill="#1565c0">默认 BIOS</text>
    <rect x="200" y="62" width="12" height="12" fill="#2e7d32"/>
    <text x="218" y="72" fill="#2e7d32">CO -20</text>
  </g>

  <!-- 稳态差距标注 -->
  <text x="560" y="175" font-size="10" fill="#c62828" font-weight="bold">稳态差距：</text>
  <text x="560" y="192" font-size="10" fill="#c62828">1.87% 吞吐 / 9.6°C 温度</text>

  <!-- 轴标题 -->
  <text x="400" y="252" font-size="10" fill="#555" text-anchor="middle">轮次 →</text>
  <text x="20" y="135" font-size="10" fill="#555" transform="rotate(-90 20,135)">GFLOP/s</text>
</svg>