<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="304" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">False sharing：时间 16.7×、cache-references 104×、CPI 24×</text>
  <text x="30" y="48" font-size="10" fill="#555">v1 / v2：时间与缓存事件差 1–2 个数量级，退休指令数几乎相同</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="210" fill="#f5f5f5"/>

  <!-- y 轴对数网格：1× / 10× / 100× / 1000× -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="190" x2="720" y2="190"/>
    <line x1="80" y1="145" x2="720" y2="145"/>
    <line x1="80" y1="100" x2="720" y2="100"/>
    <line x1="80" y1="55" x2="720" y2="55"/>
  </g>

  <!-- 1× 基线 -->
  <line x1="80" y1="190" x2="720" y2="190" stroke="#999" stroke-dasharray="4,3"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="265" x2="720" y2="265" stroke="#333"/>
  <line x1="80" y1="265" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,265 714,262 714,268" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="193">1×</text>
    <text x="74" y="148">10×</text>
    <text x="74" y="103">100×</text>
    <text x="74" y="58">1000×</text>
  </g>

  <!-- 时间：16.7× -->
  <g>
    <rect x="130" y="135.0" width="55" height="55.0" fill="#1565c0"/>
    <text x="157.5" y="129" font-size="11" fill="#1565c0" font-weight="bold" text-anchor="middle">16.7×</text>
    <text x="157.5" y="283" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">时间</text>
  </g>

  <!-- cache-references：104× -->
  <g>
    <rect x="240" y="99.9" width="55" height="90.1" fill="#2e7d32"/>
    <text x="267.5" y="93.9" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">104×</text>
    <text x="267.5" y="283" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">cache-refs</text>
  </g>

  <!-- cache-misses：383× -->
  <g>
    <rect x="350" y="73.8" width="55" height="116.2" fill="#ef6c00"/>
    <text x="377.5" y="67.8" font-size="11" fill="#ef6c00" font-weight="bold" text-anchor="middle">383×</text>
    <text x="377.5" y="283" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">cache-misses</text>
  </g>

  <!-- CPI：24.4× -->
  <g>
    <rect x="460" y="127.6" width="55" height="62.4" fill="#c62828"/>
    <text x="487.5" y="121.6" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">24.4×</text>
    <text x="487.5" y="283" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">CPI</text>
  </g>

  <!-- ex_ret_instr：1.03× -->
  <g>
    <rect x="570" y="189.4" width="55" height="0.6" fill="#757575"/>
    <text x="597.5" y="183.4" font-size="11" fill="#757575" font-weight="bold" text-anchor="middle">1.03×</text>
    <text x="597.5" y="283" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">ex_ret_instr</text>
  </g>

  <!-- 轴标题 -->
  <text x="400" y="304" font-size="10" fill="#555" text-anchor="middle">指标（对数）→</text>
  <text x="20" y="160" font-size="10" fill="#555" transform="rotate(-90 20,160)">v1 / v2 比值</text>
</svg>