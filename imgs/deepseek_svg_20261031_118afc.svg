<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="264" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">随机顺序 vs 排序：分支数几乎相同，误预测率差 4.5 倍，CPI 差 1.7 倍</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="170" fill="#f5f5f5"/>

  <!-- 水平网格：0 / 5% / 10% / 15% / 20% -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="182.5" x2="720" y2="182.5"/>
    <line x1="80" y1="140" x2="720" y2="140"/>
    <line x1="80" y1="97.5" x2="720" y2="97.5"/>
    <line x1="80" y1="55" x2="720" y2="55"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="80" y1="225" x2="720" y2="225" stroke="#333"/>
  <line x1="80" y1="225" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,225 714,222 714,228" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="228">0</text>
    <text x="74" y="185.5">5%</text>
    <text x="74" y="143">10%</text>
    <text x="74" y="100.5">15%</text>
    <text x="74" y="58">20%</text>
  </g>

  <!-- 随机：16.5% -->
  <g>
    <rect x="150" y="84.75" width="70" height="140.25" fill="#c62828"/>
    <text x="185" y="78.75" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">16.5%</text>
    <text x="185" y="245" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">随机</text>
    <text x="185" y="260" font-size="9" fill="#666" text-anchor="middle">CPI 1.91</text>
  </g>

  <!-- 排序：3.64% -->
  <g>
    <rect x="350" y="194.06" width="70" height="30.94" fill="#2e7d32"/>
    <text x="385" y="188.06" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">3.64%</text>
    <text x="385" y="245" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">排序</text>
    <text x="385" y="260" font-size="9" fill="#666" text-anchor="middle">CPI 1.12</text>
  </g>

  <!-- 差距标注 -->
  <text x="480" y="140" font-size="12" font-weight="bold" fill="#333">4.5×</text>
  <text x="480" y="155" font-size="9" fill="#666">misp rate</text>
  <text x="480" y="175" font-size="12" font-weight="bold" fill="#333">1.7×</text>
  <text x="480" y="190" font-size="9" fill="#666">CPI</text>

  <!-- 轴标题 -->
  <text x="400" y="262" font-size="10" fill="#555" text-anchor="middle">条件 →</text>
  <text x="22" y="140" font-size="10" fill="#555" transform="rotate(-90 22,140)">分支误预测率</text>
</svg>