<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="284" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="34" font-size="13" font-weight="bold" fill="#333">两种瓶颈：SMT 对共享执行单元，双物理核共享 L3 代码供给</text>

  <!-- 左：SMT 对 -->
  <rect x="30" y="60" width="350" height="220" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="85" font-size="12" font-weight="bold" fill="#1565c0">SMT 对（cpu0 + cpu6）</text>

  <rect x="60" y="105" width="80" height="40" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="72" y="130" font-size="10" fill="#1565c0">Op Cache</text>

  <rect x="60" y="155" width="80" height="40" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="66" y="180" font-size="10" fill="#ef6c00">4-wide 解码</text>

  <rect x="170" y="105" width="80" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="183" y="140" font-size="10" fill="#2e7d32" font-weight="bold">执行单元</text>
  <text x="183" y="158" font-size="9" fill="#2e7d32">（共享）</text>
  <text x="183" y="180" font-size="9" fill="#2e7d32">~3-4 cop/c</text>

  <line x1="140" y1="125" x2="170" y2="125" stroke="#666" stroke-width="1.5"/>
  <line x1="140" y1="175" x2="170" y2="175" stroke="#666" stroke-width="1.5"/>

  <text x="60" y="225" font-size="10" fill="#333">small 1.44×</text>
  <text x="60" y="243" font-size="10" fill="#333">large 1.37×</text>
  <text x="60" y="265" font-size="10" fill="#1565c0" font-weight="bold">差异 0.07 → 前端不是瓶颈</text>

  <!-- 右：双物理核 -->
  <rect x="400" y="60" width="330" height="220" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="485" y="85" font-size="12" font-weight="bold" fill="#c62828">双物理核（cpu0 + cpu1）</text>

  <rect x="420" y="105" width="60" height="40" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="424" y="130" font-size="10" fill="#1565c0">Op Cache 0</text>

  <rect x="420" y="155" width="60" height="40" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="424" y="180" font-size="10" fill="#1565c0">Op Cache 1</text>

  <rect x="500" y="105" width="60" height="40" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="508" y="130" font-size="10" fill="#2e7d32">执行单元0</text>

  <rect x="500" y="155" width="60" height="40" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="508" y="180" font-size="10" fill="#2e7d32">执行单元1</text>

  <rect x="590" y="105" width="110" height="90" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="605" y="135" font-size="10" fill="#c62828" font-weight="bold">L3 代码供给</text>
  <text x="605" y="153" font-size="9" fill="#c62828">28KB 循环体</text>
  <text x="605" y="170" font-size="9" fill="#c62828">被两核平分</text>

  <line x1="480" y1="125" x2="500" y2="125" stroke="#666" stroke-width="1.5"/>
  <line x1="480" y1="175" x2="500" y2="175" stroke="#666" stroke-width="1.5"/>
  <line x1="560" y1="125" x2="590" y2="135" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="560" y1="175" x2="590" y2="165" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="420" y="225" font-size="10" fill="#333">small 1.89×</text>
  <text x="420" y="243" font-size="10" fill="#333">large 1.64×</text>
  <text x="420" y="265" font-size="10" fill="#c62828" font-weight="bold">差异 0.25 → 跨核 L3 争抢</text>
</svg>