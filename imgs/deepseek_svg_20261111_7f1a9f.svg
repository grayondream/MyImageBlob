 <title id="chartTitle">图 9　K3 的 launch bounds 与寄存器 tile</title>
 <desc id="chartDesc">B0/B1 同为 128 regs、33.3% occupancy；B2 加 unroll 1 后降到 96 regs，但仍是 33.3%；low-reg 4×4 以 58 regs 换到 66.7%，取得最高 GFLOP/s。</desc>

