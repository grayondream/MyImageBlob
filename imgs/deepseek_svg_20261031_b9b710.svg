<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="744" height="234" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">工具三角：精度 / 侵入性 / 持续可用性</text>

  <!-- 三角区域 -->
  <polygon points="380,50 120,215 640,215" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

  <!-- 三个顶点标签 -->
  <text x="380" y="42" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">精度</text>
  <text x="120" y="235" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">低侵入性</text>
  <text x="640" y="235" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">持续可用性</text>

  <!-- 工具点 -->
  <circle cx="380" cy="100" r="12" fill="#c62828"/>
  <text x="400" y="105" font-size="11" fill="#c62828" font-weight="bold">uProf / VTune</text>

  <circle cx="285" cy="178" r="12" fill="#ef6c00"/>
  <text x="205" y="168" font-size="11" fill="#ef6c00" font-weight="bold">perf 原始事件</text>

  <circle cx="480" cy="182" r="12" fill="#2e7d32"/>
  <text x="500" y="187" font-size="11" fill="#2e7d32" font-weight="bold">eBPF</text>

  <!-- 指向“精度”的趋势箭头 -->
  <path d="M465,172 Q445,150 402,112" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)"/>
  <path d="M312,168 Q340,142 368,112" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)"/>
</svg>