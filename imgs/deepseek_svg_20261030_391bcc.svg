<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="264" fill="#fafafa" stroke="#ccc"/>

  <text x="28" y="32" font-size="13" font-weight="bold" fill="#333">表 2-1 的可视化：时间与频率严格成反比</text>

  <!-- 图例 -->
  <g font-size="10" fill="#333">
    <rect x="520" y="14" width="12" height="12" fill="#c62828"/>
    <text x="538" y="23">耗时变化（相对 baseline）</text>
    <rect x="520" y="32" width="12" height="12" fill="#1565c0"/>
    <text x="538" y="41">频率（MHz）</text>
  </g>

  <!-- 绘图区背景 -->
  <rect x="80" y="65" width="600" height="160" fill="#f5f5f5"/>

  <!-- 水平网格 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="105" x2="680" y2="105"/>
    <line x1="80" y1="145" x2="680" y2="145"/>
    <line x1="80" y1="185" x2="680" y2="185"/>
    <line x1="80" y1="225" x2="680" y2="225"/>
  </g>

  <!-- 左轴：耗时变化 % -->
  <line x1="80" y1="225" x2="80" y2="65" stroke="#333"/>
  <polygon points="80,65 77,71 83,71" fill="#333"/>
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="228">0</text>
    <text x="74" y="188">5</text>
    <text x="74" y="148">10</text>
    <text x="74" y="108">15</text>
  </g>
  <text x="20" y="150" font-size="10" fill="#555" transform="rotate(-90 20,150)">耗时变化 %</text>

  <!-- 右轴：频率 MHz -->
  <line x1="680" y1="225" x2="680" y2="65" stroke="#333"/>
  <polygon points="680,65 677,71 683,71" fill="#333"/>
  <g font-size="9" fill="#555" text-anchor="start">
    <text x="686" y="228">4000</text>
    <text x="686" y="182.3">4200</text>
    <text x="686" y="136.6">4400</text>
    <text x="686" y="90.9">4600</text>
    <text x="686" y="68">4700</text>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="680" y1="225" x2="686" y2="225"/>
    <line x1="680" y1="179.3" x2="686" y2="179.3"/>
    <line x1="680" y1="133.6" x2="686" y2="133.6"/>
    <line x1="680" y1="87.9" x2="686" y2="87.9"/>
    <line x1="680" y1="65" x2="686" y2="65"/>
  </g>
  <text x="728" y="150" font-size="10" fill="#555" transform="rotate(-90 728,150)">频率 MHz</text>

  <!-- x 轴 -->
  <line x1="80" y1="225" x2="680" y2="225" stroke="#333"/>
  <polygon points="680,225 674,222 674,228" fill="#333"/>

  <!-- powersave -->
  <g>
    <rect x="115" y="82.1" width="30" height="142.9" fill="#c62828"/>
    <rect x="155" y="202.4" width="30" height="22.6" fill="#1565c0"/>
    <text x="130" y="76" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">+13.4%</text>
    <text x="170" y="196" font-size="10" font-weight="bold" fill="#1565c0" text-anchor="middle">4099</text>
    <text x="150" y="248" font-size="10" fill="#333" text-anchor="middle">powersave</text>
  </g>

  <!-- perf -->
  <g>
    <rect x="265" y="225" width="30" height="0" fill="#c62828"/>
    <rect x="305" y="76.7" width="30" height="148.3" fill="#1565c0"/>
    <text x="280" y="219" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">基准</text>
    <text x="320" y="70" font-size="10" font-weight="bold" fill="#1565c0" text-anchor="middle">4649</text>
    <text x="300" y="248" font-size="10" fill="#333" text-anchor="middle">perf</text>
  </g>

  <!-- +5核 62°C -->
  <g>
    <rect x="415" y="215.4" width="30" height="9.6" fill="#c62828"/>
    <rect x="455" y="87.9" width="30" height="137.1" fill="#1565c0"/>
    <text x="430" y="209" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">+0.9%</text>
    <text x="470" y="81" font-size="10" font-weight="bold" fill="#1565c0" text-anchor="middle">4600</text>
    <text x="450" y="248" font-size="9" fill="#333" text-anchor="middle">+5核 62°C</text>
  </g>

  <!-- +重负载 -->
  <g>
    <rect x="565" y="204.7" width="30" height="20.3" fill="#c62828"/>
    <rect x="605" y="99.3" width="30" height="125.7" fill="#1565c0"/>
    <text x="580" y="198" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">+1.9%</text>
    <text x="620" y="93" font-size="10" font-weight="bold" fill="#1565c0" text-anchor="middle">4550</text>
    <text x="600" y="248" font-size="10" fill="#333" text-anchor="middle">+重负载</text>
  </g>

  <text x="28" y="268" font-size="9" fill="#666">耗时变化以 perf 为 baseline；频率为实测值；左右柱分别按各自轴比例映射。</text>
</svg>