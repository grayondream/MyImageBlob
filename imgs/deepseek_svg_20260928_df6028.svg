<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7db3e8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fd1b0"/>
    </marker>
    <linearGradient id="cpuCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d0f5"/><stop offset="100%" stop-color="#7db3e8"/>
    </linearGradient>
    <linearGradient id="gpuCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ee8cb"/><stop offset="100%" stop-color="#4fd1b0"/>
    </linearGradient>
    <filter id="soft" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9ab8d8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1100" height="760" fill="#fcfdff"/>
  <text x="550" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#3d4f66">CPU GEMM 与 GPU GEMM 的结构对比</text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#8ba3bd">同一矩阵乘法，两种硬件用完全不同的方式喂饱计算单元</text>

  <!-- ================= 左：CPU ================= -->
  <rect x="30" y="92" width="500" height="628" rx="16" fill="#ffffff" stroke="#c5ddf6" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="30" y="92" width="500" height="44" rx="16" fill="#c5ddf6"/>
  <rect x="30" y="120" width="500" height="16" fill="#c5ddf6"/>
  <text x="280" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5f8a">CPU GEMM：少数强核，靠缓存与流水线</text>

  <!-- DDR -->
  <rect x="80" y="162" width="400" height="50" rx="10" fill="#eef6fd" stroke="#c5ddf6" stroke-width="1.2"/>
  <text x="280" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#3a7ab5">DDR 主存</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#7db3e8">行主序 / 列主序决定预取是否连续</text>

  <!-- 缓存金字塔：严格关于 x=280 对称 -->
  <!-- L3: 顶边 280±135 (145~415) y=232；底边 280±80 (200~360) y=278 -->
  <polygon points="145,232 415,232 360,278 200,278" fill="#dcecfb" stroke="#a8d0f5" stroke-width="1.2"/>
  <text x="280" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a7ab5">L3 缓存</text>

  <!-- L2: 顶边 280±80 (200~360) y=286；底边 280±55 (225~335) y=326 -->
  <polygon points="200,286 360,286 335,326 225,326" fill="#cbe3f9" stroke="#8ec2f0" stroke-width="1.2"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#3a7ab5">L2 缓存</text>

  <!-- L1: 顶边 280±48 (232~328) y=334；底边 280±32 (248~312) y=368 -->
  <polygon points="232,334 328,334 312,368 248,368" fill="#b8d9f6" stroke="#7db3e8" stroke-width="1.2"/>
  <text x="280" y="355" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2c5f8a">L1</text>

  <line x1="280" y1="212" x2="280" y2="230" stroke="#a8d0f5" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="280" y1="278" x2="280" y2="284" stroke="#a8d0f5" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="280" y1="326" x2="280" y2="332" stroke="#a8d0f5" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="440" y="250" text-anchor="middle" font-size="10.5" fill="#7db3e8">预取</text>
  <text x="440" y="302" text-anchor="middle" font-size="10.5" fill="#7db3e8">命中</text>

  <!-- 核心区 -->
  <rect x="80" y="392" width="400" height="150" rx="12" fill="#eef6fd" stroke="#c5ddf6" stroke-width="1.2"/>
  <text x="280" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a7ab5">少量强核（4~16 核）</text>

  <rect x="135" y="432" width="70" height="60" rx="10" fill="url(#cpuCore)"/>
  <text x="170" y="467" text-anchor="middle" font-size="11" fill="#1e4266" font-weight="700">Core</text>
  <rect x="220" y="432" width="70" height="60" rx="10" fill="url(#cpuCore)"/>
  <text x="255" y="467" text-anchor="middle" font-size="11" fill="#1e4266" font-weight="700">Core</text>
  <rect x="305" y="432" width="70" height="60" rx="10" fill="url(#cpuCore)"/>
  <text x="340" y="467" text-anchor="middle" font-size="11" fill="#1e4266" font-weight="700">Core</text>
  <rect x="390" y="432" width="40" height="60" rx="10" fill="#dcecfb" stroke="#a8d0f5" stroke-width="1"/>
  <text x="410" y="467" text-anchor="middle" font-size="12" fill="#7db3e8">…</text>

  <rect x="135" y="504" width="295" height="24" rx="8" fill="#dcecfb" stroke="#a8d0f5" stroke-width="1"/>
  <text x="282" y="520" text-anchor="middle" font-size="10.5" fill="#3a7ab5">SIMD：一条指令处理多个 float（AVX / NEON）</text>

  <!-- 流水线 -->
  <rect x="80" y="562" width="400" height="66" rx="10" fill="#f5faff" stroke="#cbe3f9" stroke-width="1.2"/>
  <text x="280" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a7ab5">指令流水线</text>
  <g font-size="10" text-anchor="middle">
    <rect x="96" y="596" width="66" height="22" rx="6" fill="#c5ddf6"/><text x="129" y="611" fill="#1e4266">取指</text>
    <rect x="168" y="596" width="66" height="22" rx="6" fill="#cbe3f9"/><text x="201" y="611" fill="#1e4266">译码</text>
    <rect x="240" y="596" width="66" height="22" rx="6" fill="#dcecfb"/><text x="273" y="611" fill="#1e4266">执行</text>
    <rect x="312" y="596" width="66" height="22" rx="6" fill="#eef6fd"/><text x="345" y="611" fill="#1e4266">写回</text>
    <rect x="384" y="596" width="80" height="22" rx="6" fill="#f5faff"/><text x="424" y="611" fill="#3a7ab5">需 ILP 填满</text>
  </g>
  <text x="280" y="648" text-anchor="middle" font-size="11" fill="#5b95cc">FMA 延迟约 4 cycle，需 ≥8 条独立 FMA 同时在飞</text>
  <text x="280" y="666" text-anchor="middle" font-size="11" fill="#5b95cc">否则流水线停顿，算力闲置</text>

  <!-- ================= 右：GPU ================= -->
  <rect x="570" y="92" width="500" height="628" rx="16" fill="#ffffff" stroke="#b8ecdb" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="570" y="92" width="500" height="44" rx="16" fill="#b8ecdb"/>
  <rect x="570" y="120" width="500" height="16" fill="#b8ecdb"/>
  <text x="820" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1e7a62">GPU GEMM：海量小核，靠并行与分块</text>

  <!-- Global Memory -->
  <rect x="620" y="162" width="400" height="50" rx="10" fill="#eefaf6" stroke="#b8ecdb" stroke-width="1.2"/>
  <text x="820" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#2a9478">Global Memory（HBM / L2）</text>
  <text x="820" y="202" text-anchor="middle" font-size="11" fill="#4fd1b0">合并访问 coalesced：warp 32 线程一次宽事务</text>

  <line x1="820" y1="212" x2="820" y2="232" stroke="#4fd1b0" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="900" y="228" text-anchor="middle" font-size="10.5" fill="#4fd1b0">Tiling</text>

  <!-- Shared Memory -->
  <rect x="640" y="240" width="360" height="94" rx="12" fill="#eefaf6" stroke="#b8ecdb" stroke-width="1.2"/>
  <text x="820" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2a9478">Shared Memory 分块复用</text>
  <g stroke="#7de0c4" stroke-width="1" fill="#d4f5ea">
    <rect x="668" y="272" width="38" height="38" rx="6"/>
    <rect x="712" y="272" width="38" height="38" rx="6"/>
    <rect x="756" y="272" width="38" height="38" rx="6"/>
    <rect x="800" y="272" width="38" height="38" rx="6"/>
    <rect x="844" y="272" width="38" height="38" rx="6"/>
    <rect x="888" y="272" width="38" height="38" rx="6"/>
    <rect x="932" y="272" width="38" height="38" rx="6"/>
  </g>
  <text x="820" y="328" text-anchor="middle" font-size="10.5" fill="#4fd1b0">协作加载 → 片上复用 → 减少全局访存</text>

  <line x1="820" y1="334" x2="820" y2="352" stroke="#4fd1b0" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- SM 阵列 -->
  <rect x="620" y="358" width="400" height="184" rx="12" fill="#eefaf6" stroke="#b8ecdb" stroke-width="1.2"/>
  <text x="820" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2a9478">大量 SM（数十~上百个）+ 海量线程</text>

  <g>
    <rect x="638" y="394" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="716" y="394" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="794" y="394" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="872" y="394" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="950" y="394" width="52" height="52" rx="10" fill="#d4f5ea" stroke="#7de0c4" stroke-width="1"/>
    <text x="976" y="424" text-anchor="middle" font-size="12" fill="#4fd1b0">…</text>

    <rect x="638" y="456" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="716" y="456" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="794" y="456" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="872" y="456" width="70" height="52" rx="10" fill="url(#gpuCore)"/>
    <rect x="950" y="456" width="52" height="52" rx="10" fill="#d4f5ea" stroke="#7de0c4" stroke-width="1"/>
    <text x="976" y="486" text-anchor="middle" font-size="12" fill="#4fd1b0">…</text>
  </g>
  <g font-size="10" fill="#155e4b" text-anchor="middle" font-weight="700">
    <text x="673" y="424">SM</text><text x="751" y="424">SM</text><text x="829" y="424">SM</text><text x="907" y="424">SM</text>
    <text x="673" y="486">SM</text><text x="751" y="486">SM</text><text x="829" y="486">SM</text><text x="907" y="486">SM</text>
  </g>

  <rect x="638" y="516" width="364" height="20" rx="8" fill="#d4f5ea" stroke="#7de0c4" stroke-width="1"/>
  <text x="820" y="530" text-anchor="middle" font-size="10.5" fill="#2a9478">每个 SM：CUDA Core + Tensor Core + 寄存器堆</text>

  <!-- Warp 调度 -->
  <rect x="620" y="562" width="400" height="66" rx="10" fill="#eefaf6" stroke="#b8ecdb" stroke-width="1.2"/>
  <text x="820" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a9478">Warp 调度：延迟隐藏</text>
  <g font-size="10" text-anchor="middle">
    <rect x="636" y="596" width="60" height="22" rx="6" fill="#b8ecdb"/><text x="666" y="611" fill="#155e4b">warp0</text>
    <rect x="702" y="596" width="60" height="22" rx="6" fill="#8ee8cb"/><text x="732" y="611" fill="#155e4b">warp1</text>
    <rect x="768" y="596" width="60" height="22" rx="6" fill="#6edcbb"/><text x="798" y="611" fill="#155e4b">warp2</text>
    <rect x="834" y="596" width="60" height="22" rx="6" fill="#4fd1b0"/><text x="864" y="611" fill="#ffffff">warp3</text>
    <rect x="900" y="596" width="104" height="22" rx="6" fill="#d4f5ea"/><text x="952" y="611" fill="#2a9478">停顿时立即切换</text>
  </g>
  <text x="820" y="648" text-anchor="middle" font-size="11" fill="#37b596">Occupancy 平衡：太低无法隐藏延迟，太高则寄存器 / SMEM 受限</text>
  <text x="820" y="666" text-anchor="middle" font-size="11" fill="#37b596">用 TLP 换延迟隐藏，而非依赖单条指令快</text>

  <!-- 中缝 -->
  <line x1="550" y1="104" x2="550" y2="712" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="550" y="740" text-anchor="middle" font-size="12" fill="#8ba3bd">左：串行深度优化　　右：并行广度优化</text>
</svg>