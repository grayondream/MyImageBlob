<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="744" height="264" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="28" y="34" font-size="14" font-weight="700" fill="#111827">实验 A：三种工作集下的有效带宽（交替测量后）</text>

  <!-- 图例 -->
  <g transform="translate(500,20)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#blueGrad)"/>
    <text x="18" y="10" font-size="10" fill="#374151">v1 (base%64=16)</text>
    <rect x="120" y="0" width="12" height="12" rx="2" fill="url(#redGrad)"/>
    <text x="138" y="10" font-size="10" fill="#374151">v2 (base%64=0)</text>
  </g>

  <!-- 网格线 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="76" y1="232" x2="720" y2="232"/>
    <line x1="76" y1="198.4" x2="720" y2="198.4"/>
    <line x1="76" y1="164.8" x2="720" y2="164.8"/>
    <line x1="76" y1="131.2" x2="720" y2="131.2"/>
    <line x1="76" y1="97.6" x2="720" y2="97.6"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="76" y1="232" x2="720" y2="232" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="76" y1="232" x2="76" y2="64" stroke="#6b7280" stroke-width="1.2"/>

  <!-- y 轴刻度 -->
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <text x="66" y="235.5">0</text>
    <text x="66" y="201.9">20</text>
    <text x="66" y="168.3">40</text>
    <text x="66" y="134.7">60</text>
    <text x="66" y="101.1">80</text>
    <text x="66" y="67.5">100</text>
  </g>

  <text x="22" y="150" font-size="10" fill="#6b7280" transform="rotate(-90 22,150)">GB/s</text>
  <text x="398" y="270" font-size="10" fill="#6b7280" text-anchor="middle">工作集（场景）→</text>

  <!-- DRAM 256MB -->
  <g>
    <rect x="140" y="190" width="36" height="42" rx="4" fill="url(#blueGrad)"/>
    <rect x="184" y="188.3" width="36" height="43.7" rx="4" fill="url(#redGrad)"/>
    <text x="158" y="184" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">25</text>
    <text x="202" y="182.3" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">26</text>
    <text x="180" y="252" font-size="10" fill="#374151" text-anchor="middle">DRAM 256MB</text>
  </g>

  <!-- L3 2MB -->
  <g>
    <rect x="340" y="85.2" width="36" height="146.8" rx="4" fill="url(#blueGrad)"/>
    <rect x="384" y="85.7" width="36" height="146.3" rx="4" fill="url(#redGrad)"/>
    <text x="358" y="79.2" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">87.4</text>
    <text x="402" y="79.7" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">87.1</text>
    <text x="380" y="252" font-size="10" fill="#374151" text-anchor="middle">L3 2MB</text>
  </g>

  <!-- L2 512KB -->
  <g>
    <rect x="540" y="73.6" width="36" height="158.4" rx="4" fill="url(#blueGrad)"/>
    <rect x="584" y="76.3" width="36" height="155.7" rx="4" fill="url(#redGrad)"/>
    <text x="558" y="67.6" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">94.3</text>
    <text x="602" y="70.3" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">92.7</text>
    <text x="580" y="252" font-size="10" fill="#374151" text-anchor="middle">L2 512KB</text>
  </g>
</svg>