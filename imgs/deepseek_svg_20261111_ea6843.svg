<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230"
     font-family="sans-serif" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">图 6　setmaxnreg 动态寄存器重分配</title>
  <desc id="chartDesc">同一 CTA 内 Producer 使用 40 个寄存器、Consumer 使用 232 个寄存器，通过 setmaxnreg 指令相互让渡寄存器。</desc>

  <defs>
    <marker id="arr6" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- CTA 外框 -->
  <rect x="40" y="20" width="480" height="160" rx="8" fill="none"
        stroke="#7f8c8d" stroke-width="2"/>
  <text x="60" y="42" font-size="11" fill="#7f8c8d">CTA</text>

  <!-- Producer -->
  <rect x="60" y="55" width="200" height="105" rx="6" fill="#3498db" opacity="0.9"/>
  <text x="160" y="80" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Producer</text>
  <text x="160" y="102" text-anchor="middle" fill="#fff" font-size="11">TMA 加载</text>
  <text x="160" y="124" text-anchor="middle" fill="#fff" font-size="11">40 regs</text>
  <text x="160" y="146" text-anchor="middle" fill="#fff" font-size="10">setmaxnreg.dec</text>

  <!-- Consumer -->
  <rect x="300" y="55" width="200" height="105" rx="6" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="80" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Consumer</text>
  <text x="400" y="102" text-anchor="middle" fill="#fff" font-size="11">WGMMA</text>
  <text x="400" y="124" text-anchor="middle" fill="#fff" font-size="11">232 regs</text>
  <text x="400" y="146" text-anchor="middle" fill="#fff" font-size="10">setmaxnreg.inc</text>

  <!-- 让渡箭头 -->
  <line x1="260" y1="107" x2="300" y2="107" stroke="#f39c12" stroke-width="3"
        marker-end="url(#arr6)"/>
  <text x="280" y="99" text-anchor="middle" font-size="10" fill="#f39c12">让渡</text>

  <!-- 图注 -->
  <text x="280" y="216" text-anchor="middle" font-size="12" font-style="italic"
        fill="#555">图 6　setmaxnreg 动态寄存器重分配</text>
</svg>