<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="84" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82" y="90" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">Q</text>
  <text x="82" y="107" font-size="11" fill="#64748b" text-anchor="middle">N × d</text>

  <rect x="40" y="170" width="84" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82" y="190" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">K</text>
  <text x="82" y="207" font-size="11" fill="#64748b" text-anchor="middle">N × d</text>

  <circle cx="190" cy="144" r="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="190" y="151" font-size="20" fill="#334155" text-anchor="middle">×</text>

  <rect x="250" y="120" width="100" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="300" y="140" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="600">S = QKᵀ</text>
  <text x="300" y="157" font-size="11" fill="#b91c1c" text-anchor="middle">N × N</text>
  <text x="300" y="192" font-size="10.5" fill="#dc2626" text-anchor="middle">N² 元素写入 HBM</text>

  <rect x="400" y="120" width="100" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="149" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">softmax</text>

  <rect x="550" y="120" width="100" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="600" y="140" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="600">P</text>
  <text x="600" y="157" font-size="11" fill="#b91c1c" text-anchor="middle">N × N</text>
  <text x="600" y="192" font-size="10.5" fill="#dc2626" text-anchor="middle">N² 元素写入 HBM</text>

  <circle cx="710" cy="144" r="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="710" y="151" font-size="20" fill="#334155" text-anchor="middle">×</text>

  <rect x="640" y="240" width="84" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="682" y="260" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">V</text>
  <text x="682" y="277" font-size="11" fill="#64748b" text-anchor="middle">N × d</text>

  <rect x="790" y="120" width="100" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="840" y="140" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">O</text>
  <text x="840" y="157" font-size="11" fill="#64748b" text-anchor="middle">N × d</text>

  <path d="M124,94 L170.9,129.5" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M124,194 L170.9,158.5" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M214,144 L250,144" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M350,144 L400,144" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M500,144 L550,144" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M650,144 L686,144" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M682,240 L703.3,167.0" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M734,144 L790,144" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="300" width="310" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="195" y="320" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Kernel 1 · QKᵀ</text>
  <text x="195" y="336" font-size="11" fill="#64748b" text-anchor="middle">读 Q, K → 写 S</text>

  <rect x="350" y="300" width="200" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="450" y="320" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Kernel 2 · softmax</text>
  <text x="450" y="336" font-size="11" fill="#64748b" text-anchor="middle">读 S → 写 P</text>

  <rect x="550" y="300" width="340" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="720" y="320" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Kernel 3 · PV</text>
  <text x="720" y="336" font-size="11" fill="#64748b" text-anchor="middle">读 P, V → 写 O</text>

  <rect x="60" y="375" width="18" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="86" y="389" font-size="12" fill="#334155">输入/输出张量（随 N 线性增长）</text>

  <rect x="330" y="375" width="18" height="18" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="356" y="389" font-size="12" fill="#334155">N × N 中间矩阵（随 N² 增长）</text>

  <circle cx="600" cy="384" r="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="618" y="389" font-size="12" fill="#334155">运算</text>

  <text x="480" y="430" font-size="12" fill="#475569" text-anchor="middle">三个 kernel 各自完整执行「读 HBM → 计算 → 写 HBM」；S 与 P 是 HBM 流量的主导项</text>
</svg>