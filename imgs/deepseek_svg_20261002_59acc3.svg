<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6f9"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="gradV2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="100%" stop-color="#b8e0f0"/>
    </linearGradient>
    <linearGradient id="gradV3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8b6e2"/>
      <stop offset="100%" stop-color="#e0d4f0"/>
    </linearGradient>
    <linearGradient id="gradV4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8d8b9"/>
      <stop offset="100%" stop-color="#c8e8d4"/>
    </linearGradient>
    <linearGradient id="gradV5" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9d89c"/>
      <stop offset="100%" stop-color="#fce8c8"/>
    </linearGradient>
    <filter id="shadowBar" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="980" height="700" fill="url(#bg)" rx="12"/>

  <!-- 标题 -->
  <text x="490" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#3a3a5c">GEMM v2 / v3 / v4 / v5 综合对比</text>
  <text x="490" y="72" text-anchor="middle" font-size="13" fill="#8888a8">柱状：GFLOPS（越高越好） · 折线：耗时 ms（越低越好） · 单线程 · 对数坐标</text>

  <!-- 图例 -->
  <g transform="translate(90, 92)">
    <rect x="0" y="0" width="15" height="15" rx="4" fill="url(#gradV2)" filter="url(#shadowBar)"/>
    <text x="20" y="12" font-size="11" fill="#555577">v2 GFLOPS</text>
    <rect x="110" y="0" width="15" height="15" rx="4" fill="url(#gradV3)" filter="url(#shadowBar)"/>
    <text x="130" y="12" font-size="11" fill="#555577">v3 GFLOPS</text>
    <rect x="220" y="0" width="15" height="15" rx="4" fill="url(#gradV4)" filter="url(#shadowBar)"/>
    <text x="240" y="12" font-size="11" fill="#555577">v4 GFLOPS</text>
    <rect x="330" y="0" width="15" height="15" rx="4" fill="url(#gradV5)" filter="url(#shadowBar)"/>
    <text x="350" y="12" font-size="11" fill="#555577">v5 GFLOPS</text>
    <line x1="460" y1="7" x2="488" y2="7" stroke="#5a9ab5" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="474" cy="7" r="3.5" fill="#5a9ab5"/>
    <text x="496" y="12" font-size="11" fill="#555577">v2 耗时</text>
    <line x1="570" y1="7" x2="598" y2="7" stroke="#9b8ab8" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="584" cy="7" r="3.5" fill="#9b8ab8"/>
    <text x="606" y="12" font-size="11" fill="#555577">v3 耗时</text>
    <line x1="680" y1="7" x2="708" y2="7" stroke="#6aab7a" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="694" cy="7" r="3.5" fill="#6aab7a"/>
    <text x="716" y="12" font-size="11" fill="#555577">v4 耗时</text>
    <line x1="790" y1="7" x2="818" y2="7" stroke="#c9a040" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="804" cy="7" r="3.5" fill="#c9a040"/>
    <text x="826" y="12" font-size="11" fill="#555577">v5 耗时</text>
  </g>

  <!-- 图表区域 -->
  <g transform="translate(110, 130)">

    <!-- ===== 左侧 Y轴：GFLOPS ===== -->
    <line x1="0" y1="430" x2="740" y2="430" stroke="#e8e8f0" stroke-width="1"/>
    <text x="-10" y="434" text-anchor="end" font-size="11" fill="#aaaacc">10</text>

    <line x1="0" y1="323" x2="740" y2="323" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="327" text-anchor="end" font-size="11" fill="#aaaacc">20</text>

    <line x1="0" y1="215" x2="740" y2="215" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="219" text-anchor="end" font-size="11" fill="#aaaacc">40</text>

    <line x1="0" y1="108" x2="740" y2="108" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="112" text-anchor="end" font-size="11" fill="#aaaacc">80</text>

    <line x1="0" y1="0" x2="740" y2="0" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="4" text-anchor="end" font-size="11" fill="#aaaacc">160</text>

    <text x="-60" y="215" text-anchor="middle" font-size="13" fill="#8888a8" transform="rotate(-90, -60, 215)">GFLOPS（柱状）</text>

    <!-- ===== 右侧 Y轴：耗时（ms） ===== -->
    <line x1="740" y1="430" x2="740" y2="0" stroke="#d0d0e0" stroke-width="1.5"/>
    <text x="750" y="434" text-anchor="start" font-size="11" fill="#aaaacc">0.3</text>
    <text x="750" y="369" text-anchor="start" font-size="11" fill="#aaaacc">1</text>
    <text x="750" y="246" text-anchor="start" font-size="11" fill="#aaaacc">10</text>
    <text x="750" y="123" text-anchor="start" font-size="11" fill="#aaaacc">100</text>
    <text x="750" y="4" text-anchor="start" font-size="11" fill="#aaaacc">1000</text>

    <text x="815" y="215" text-anchor="middle" font-size="13" fill="#8888a8" transform="rotate(90, 815, 215)">耗时 ms（折线）</text>

    <!-- ===== 计算坐标 ===== -->

    <!--
      GFLOPS → y = 430 - (log10(g) - 1) * 122.86

      v2: 32.13 → log=1.507 → y=430-0.507*122.86=367.7
          32.01 → log=1.505 → y=430-0.505*122.86=368.0
          27.10 → log=1.433 → y=430-0.433*122.86=376.8

      v3: 30.19 → log=1.480 → y=430-0.480*122.86=371.0
          21.37 → log=1.330 → y=430-0.330*122.86=389.5
          19.82 → log=1.297 → y=430-0.297*122.86=393.5

      v4: 30.37 → log=1.482 → y=430-0.482*122.86=370.8
          26.11 → log=1.417 → y=430-0.417*122.86=378.8
          24.87 → log=1.396 → y=430-0.396*122.86=381.3

      v5: 33.60 → log=1.526 → y=430-0.526*122.86=365.4
          31.94 → log=1.504 → y=430-0.504*122.86=368.1
          29.90 → log=1.476 → y=430-0.476*122.86=371.5

      耗时 ms → y = 430 - (log10(ms) + 0.5) * 122.86

      v2: 1.044 → log=0.019 → y=430-0.519*122.86=366.2
          67.08 → log=1.827 → y=430-2.327*122.86=144.1
          633.88 → log=2.802 → y=430-3.302*122.86=24.3

      v3: 1.111 → log=0.046 → y=430-0.546*122.86=362.9
          100.49 → log=2.002 → y=430-2.502*122.86=122.6
          866.73 → log=2.938 → y=430-3.438*122.86=7.6

      v4: 1.105 → log=0.043 → y=430-0.543*122.86=363.3
          82.25 → log=1.915 → y=430-2.415*122.86=133.3
          690.71 → log=2.839 → y=430-3.339*122.86=19.8

      v5: 0.999 → log=-0.001 → y=430-0.499*122.86=368.7
          67.23 → log=1.828 → y=430-2.328*122.86=144.0
          574.67 → log=2.759 → y=430-3.259*122.86=29.6
    -->

    <!-- 第一组：256³ -->
    <g>
      <rect x="40" y="368" width="32" height="62" rx="5" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="56" y="361" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">32.13</text>

      <rect x="80" y="371" width="32" height="59" rx="5" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="96" y="364" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">30.19</text>

      <rect x="120" y="371" width="32" height="59" rx="5" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="136" y="364" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">30.37</text>

      <rect x="160" y="365" width="32" height="65" rx="5" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="176" y="358" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">33.60</text>

      <!-- 耗时点 -->
      <circle cx="56" cy="366" r="4" fill="#5a9ab5" stroke="#fff" stroke-width="1.5"/>
      <circle cx="96" cy="363" r="4" fill="#9b8ab8" stroke="#fff" stroke-width="1.5"/>
      <circle cx="136" cy="363" r="4" fill="#6aab7a" stroke="#fff" stroke-width="1.5"/>
      <circle cx="176" cy="369" r="4" fill="#c9a040" stroke="#fff" stroke-width="1.5"/>

      <text x="116" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">256³</text>
    </g>

    <!-- 第二组：1024³ -->
    <g>
      <rect x="285" y="368" width="32" height="62" rx="5" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="301" y="361" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">32.01</text>

      <rect x="325" y="390" width="32" height="40" rx="5" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="341" y="383" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">21.37</text>

      <rect x="365" y="379" width="32" height="51" rx="5" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="381" y="372" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">26.11</text>

      <rect x="405" y="368" width="32" height="62" rx="5" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="421" y="361" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">31.94</text>

      <!-- 耗时点 -->
      <circle cx="301" cy="144" r="4" fill="#5a9ab5" stroke="#fff" stroke-width="1.5"/>
      <circle cx="341" cy="123" r="4" fill="#9b8ab8" stroke="#fff" stroke-width="1.5"/>
      <circle cx="381" cy="133" r="4" fill="#6aab7a" stroke="#fff" stroke-width="1.5"/>
      <circle cx="421" cy="144" r="4" fill="#c9a040" stroke="#fff" stroke-width="1.5"/>

      <text x="361" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">1024³</text>
    </g>

    <!-- 第三组：2048³ -->
    <g>
      <rect x="530" y="377" width="32" height="53" rx="5" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="546" y="370" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">27.10</text>

      <rect x="570" y="394" width="32" height="36" rx="5" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="586" y="387" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">19.82</text>

      <rect x="610" y="381" width="32" height="49" rx="5" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="626" y="374" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">24.87</text>

      <rect x="650" y="372" width="32" height="58" rx="5" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="666" y="365" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">29.90</text>

      <!-- 耗时点 -->
      <circle cx="546" cy="24" r="4" fill="#5a9ab5" stroke="#fff" stroke-width="1.5"/>
      <circle cx="586" cy="8" r="4" fill="#9b8ab8" stroke="#fff" stroke-width="1.5"/>
      <circle cx="626" cy="20" r="4" fill="#6aab7a" stroke="#fff" stroke-width="1.5"/>
      <circle cx="666" cy="30" r="4" fill="#c9a040" stroke="#fff" stroke-width="1.5"/>

      <text x="606" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">2048³</text>
    </g>

    <!-- 折线连接 -->
    <polyline points="56,366 301,144 546,24" fill="none" stroke="#5a9ab5" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="96,363 341,123 586,8" fill="none" stroke="#9b8ab8" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="136,363 381,133 626,20" fill="none" stroke="#6aab7a" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="176,369 421,144 666,30" fill="none" stroke="#c9a040" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>

    <!-- X轴 -->
    <line x1="0" y1="430" x2="740" y2="430" stroke="#c0c0d8" stroke-width="1.5"/>
  </g>

  <!-- 底部数据摘要 -->
  <g transform="translate(110, 600)">
    <rect x="0" y="0" width="740" height="86" rx="8" fill="#ffffff88" stroke="#e0e0f0" stroke-width="1"/>

    <text x="18" y="22" font-size="12" font-weight="700" fill="#5a9ab5">v2（ikj 循环交换）</text>
    <text x="18" y="42" font-size="11" fill="#8888a8">GFLOPS：32.13 → 32.01 → 27.10</text>
    <text x="18" y="60" font-size="11" fill="#8888a8">耗时：1.04ms → 67.1ms → 633.9ms</text>

    <text x="240" y="22" font-size="12" font-weight="700" fill="#9b8ab8">v3（缓存分块）</text>
    <text x="240" y="42" font-size="11" fill="#8888a8">GFLOPS：30.19 → 21.37 → 19.82</text>
    <text x="240" y="60" font-size="11" fill="#8888a8">耗时：1.11ms → 100.5ms → 866.7ms</text>

    <text x="470" y="22" font-size="12" font-weight="700" fill="#6aab7a">v4（分块 + 打包）</text>
    <text x="470" y="42" font-size="11" fill="#8888a8">GFLOPS：30.37 → 26.11 → 24.87</text>
    <text x="470" y="60" font-size="11" fill="#8888a8">耗时：1.11ms → 82.3ms → 690.7ms</text>

    <text x="18" y="80" font-size="12" font-weight="700" fill="#c9a040">v5（分块 + 打包 + 微内核）</text>
    <text x="240" y="80" font-size="11" fill="#8888a8">GFLOPS：33.60 → 31.94 → 29.90（全面领先）</text>
    <text x="520" y="80" font-size="11" fill="#8888a8">耗时：1.00ms → 67.2ms → 574.7ms</text>
  </g>
</svg>