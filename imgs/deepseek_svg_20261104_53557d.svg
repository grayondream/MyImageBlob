<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="340" rx="14" fill="url(#bg)" stroke="#dbe3ef"/>

  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">图 7  分层证据链与闭环验证</text>
  <rect x="330" y="42" width="100" height="3" rx="1.5" fill="#14b8a6" opacity="0.8"/>

  <g text-anchor="middle">
    <rect x="28" y="70" width="128" height="74" rx="10" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="46" cy="88" r="9" fill="#42a5f5"/>
    <text x="46" y="92" font-size="10" font-weight="700" fill="#ffffff">1</text>
    <text x="92" y="98" font-size="13" font-weight="700" fill="#0d47a1">计数器</text>
    <text x="92" y="118" font-size="10.5" fill="#1565c0">perf stat</text>

    <rect x="174" y="70" width="128" height="74" rx="10" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="192" cy="88" r="9" fill="#5c6bc0"/>
    <text x="192" y="92" font-size="10" font-weight="700" fill="#ffffff">2</text>
    <text x="238" y="98" font-size="13" font-weight="700" fill="#1a237e">采样</text>
    <text x="238" y="118" font-size="10.5" fill="#283593">perf report</text>

    <rect x="320" y="70" width="128" height="74" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="338" cy="88" r="9" fill="#fb8c00"/>
    <text x="338" y="92" font-size="10" font-weight="700" fill="#ffffff">3</text>
    <text x="384" y="98" font-size="13" font-weight="700" fill="#e65100">缓存行</text>
    <text x="384" y="118" font-size="10.5" fill="#ef6c00">perf c2c</text>

    <rect x="466" y="70" width="128" height="74" rx="10" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="484" cy="88" r="9" fill="#ec407a"/>
    <text x="484" y="92" font-size="10" font-weight="700" fill="#ffffff">4</text>
    <text x="530" y="98" font-size="13" font-weight="700" fill="#880e4f">指令</text>
    <text x="530" y="118" font-size="10.5" fill="#ad1457">perf annotate</text>

    <rect x="612" y="70" width="128" height="74" rx="10" fill="#e8f5e9" stroke="#81c784" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="630" cy="88" r="9" fill="#43a047"/>
    <text x="630" y="92" font-size="10" font-weight="700" fill="#ffffff">5</text>
    <text x="676" y="98" font-size="13" font-weight="700" fill="#1b5e20">精确归属</text>
    <text x="676" y="118" font-size="10.5" fill="#2e7d32">IBS op</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr5)">
    <line x1="158" y1="107" x2="172" y2="107"/>
    <line x1="304" y1="107" x2="318" y2="107"/>
    <line x1="450" y1="107" x2="464" y2="107"/>
    <line x1="596" y1="107" x2="610" y2="107"/>
  </g>

  <rect x="170" y="160" width="420" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#455a64">每一层只负责回答一个问题，并缩小下一层的搜索空间</text>

  <path d="M676,148 C676,214 92,214 92,148" stroke="#14b8a6" stroke-width="2" fill="none" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#arr6)"/>
  <text x="380" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="1">闭环验证</text>
  <text x="380" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">改动后回到同一测量起点，逐环确认方向</text>

  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <rect x="128" y="270" width="146" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="201" y="287" fill="#047857">✓ IPC 上升</text>

    <rect x="292" y="270" width="160" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="372" y="287" fill="#047857">✓ L1 miss 下降</text>

    <rect x="470" y="270" width="146" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="543" y="287" fill="#047857">✓ runtime 下降</text>
  </g>

  <text x="380" y="318" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">三者同向，才构成闭环</text>
</svg>