<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     font-family="'Microsoft YaHei','PingFang SC',system-ui,-apple-system,'Segoe UI',sans-serif"
     role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">活跃区间对比：长 vs 短</title>
  <desc id="chartDesc">长活跃区间全程占用寄存器；短活跃区间分为计算、使用、释放三个阶段。</desc>

  <defs>
    <linearGradient id="longGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <linearGradient id="shortGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 背景卡片 -->
  <rect x="8" y="8" width="704" height="248" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="24" y="24" width="672" height="216" rx="12" fill="#ffffff" stroke="#eef2f7"/>

  <!-- 竖向参考网格 -->
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="110" y1="48" x2="110" y2="206"/>
    <line x1="220" y1="48" x2="220" y2="206"/>
    <line x1="330" y1="48" x2="330" y2="206"/>
    <line x1="440" y1="48" x2="440" y2="206"/>
    <line x1="550" y1="48" x2="550" y2="206"/>
    <line x1="640" y1="48" x2="640" y2="206"/>
  </g>

  <!-- 左侧标签 -->
  <rect x="32" y="68" width="54" height="30" rx="15" fill="#fee2e2"/>
  <text x="59" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">长</text>

  <rect x="32" y="154" width="54" height="30" rx="15" fill="#d1fae5"/>
  <text x="59" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">短</text>

  <!-- 长活跃区间轨道 -->
  <rect x="110" y="64" width="530" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="110" y="64" width="530" height="38" rx="10"
        fill="url(#longGrad)" filter="url(#softShadow)"/>
  <text x="375" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">
    变量 A 全程占用寄存器
  </text>

  <!-- 短活跃区间轨道 -->
  <rect x="110" y="150" width="530" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="110" y="150" width="120" height="38" rx="8"
        fill="url(#shortGrad)" filter="url(#softShadow)"/>
  <text x="170" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">计算</text>

  <rect x="330" y="150" width="120" height="38" rx="8"
        fill="url(#shortGrad)" filter="url(#softShadow)"/>
  <text x="390" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">使用</text>

  <rect x="550" y="150" width="90" height="38" rx="8"
        fill="url(#shortGrad)" filter="url(#softShadow)"/>
  <text x="595" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">释放</text>

  <!-- 时间轴 -->
  <line x1="110" y1="224" x2="650" y2="224" stroke="#94a3b8" stroke-width="1.5"
        marker-end="url(#arrowHead)"/>
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#64748b">
    时间 / 指令流
  </text>

  <!-- 图注 -->
  <text x="360" y="286" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">
    图 4　活跃区间对比：长 vs 短
  </text>
</svg>