<svg width="760" height="280" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="264" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">5600X：AVX2 指令数降到 0.30×，GFLOP/s 升到 5.79×</text>
  <text x="30" y="48" font-size="9" fill="#666">柱高按 GFLOP/s 相对标量的线性比例绘制；1.0× 为标量基准</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="170" fill="#f5f5f5"/>

  <!-- 水平网格：0–6× -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="196.7" x2="720" y2="196.7"/>
    <line x1="80" y1="168.3" x2="720" y2="168.3"/>
    <line x1="80" y1="140.0" x2="720" y2="140.0"/>
    <line x1="80" y1="111.7" x2="720" y2="111.7"/>
    <line x1="80" y1="83.3" x2="720" y2="83.3"/>
    <line x1="80" y1="55.0" x2="720" y2="55.0"/>
  </g>

  <!-- 1.0× 基准线 -->
  <line x1="80" y1="196.7" x2="720" y2="196.7" stroke="#999" stroke-dasharray="4,3"/>
  <text x="714" y="192.7" font-size="9" fill="#999" text-anchor="end">1.0× 标量基准</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="225" x2="720" y2="225" stroke="#333"/>
  <line x1="80" y1="225" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,225 714,222 714,228" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="228">0</text>
    <text x="74" y="199.7">1×</text>
    <text x="74" y="171.3">2×</text>
    <text x="74" y="143.0">3×</text>
    <text x="74" y="114.7">4×</text>
    <text x="74" y="86.3">5×</text>
    <text x="74" y="58.0">6×</text>
  </g>

  <!-- scalar：1.00× -->
  <g>
    <rect x="130" y="196.7" width="60" height="28.3" fill="#1565c0"/>
    <text x="160" y="215" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">1.00×</text>
    <text x="160" y="245" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">scalar</text>
    <text x="160" y="260" font-size="9" fill="#666" text-anchor="middle">4.86 GF/s</text>
  </g>

  <!-- AVX2：5.79× -->
  <g>
    <rect x="290" y="60.9" width="60" height="164.1" fill="#2e7d32"/>
    <text x="320" y="82" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">5.79×</text>
    <text x="320" y="245" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">AVX2</text>
    <text x="320" y="260" font-size="9" fill="#666" text-anchor="middle">28.17 GF/s</text>
  </g>

  <!-- “AVX-512” 回退：5.92× -->
  <g>
    <rect x="450" y="57.3" width="60" height="167.7" fill="#757575"/>
    <text x="480" y="78" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">5.92×</text>
    <text x="480" y="245" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">“AVX-512”</text>
    <text x="480" y="260" font-size="9" fill="#666" text-anchor="middle">回退到 AVX2</text>
  </g>

  <!-- 差异标注 -->
  <text x="600" y="120" font-size="10" fill="#333" font-weight="bold">AVX2 vs 回退：</text>
  <text x="600" y="136" font-size="9" fill="#666">5.92 / 5.79 ≈ 1.02×</text>
  <text x="600" y="152" font-size="9" fill="#666">两者几乎相同</text>

  <!-- 轴标题 -->
  <text x="400" y="262" font-size="10" fill="#555" text-anchor="middle">版本 →</text>
  <text x="22" y="140" font-size="10" fill="#555" transform="rotate(-90 22,140)">相对标量（GFLOP/s）</text>
</svg>