<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">2.2 朴素实现：C[i,j] = Σₖ A[i,k] · B[k,j]</text>

  <!-- ==================== 矩阵运算区域 ==================== -->
  
  <!-- A 矩阵 -->
  <g transform="translate(70, 80)">
    <text x="60" y="-10" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">A（行主序，M×K）</text>
    <rect x="0" y="0" width="120" height="140" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="2"/>
    <!-- 网格线 -->
    <line x1="0" y1="35" x2="120" y2="35" stroke="#93c5fd" stroke-width="0.8"/>
    <line x1="0" y1="70" x2="120" y2="70" stroke="#93c5fd" stroke-width="0.8"/>
    <line x1="0" y1="105" x2="120" y2="105" stroke="#93c5fd" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="30" y2="140" stroke="#93c5fd" stroke-width="0.8"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="#93c5fd" stroke-width="0.8"/>
    <line x1="90" y1="0" x2="90" y2="140" stroke="#93c5fd" stroke-width="0.8"/>
    <!-- 高亮第 i 行（第 2 行） -->
    <rect x="0" y="35" width="120" height="35" fill="#3b82f6" fill-opacity="0.35" rx="1"/>
    <!-- 行标 i -->
    <text x="-15" y="58" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">i</text>
  </g>
  <!-- A 连续访问箭头 -->
  <g transform="translate(70, 235)">
    <line x1="10" y1="0" x2="110" y2="0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="60" y="15" text-anchor="middle" font-size="11" fill="#2563eb">沿 k 连续访问</text>
  </g>

  <!-- 乘号 -->
  <text x="225" y="165" text-anchor="middle" font-size="26" fill="#555">×</text>

  <!-- B 矩阵 -->
  <g transform="translate(260, 80)">
    <text x="60" y="-10" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">B（行主序，K×N）</text>
    <rect x="0" y="0" width="120" height="140" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#fcd34d" stroke-width="0.8"/>
    <line x1="0" y1="70" x2="120" y2="70" stroke="#fcd34d" stroke-width="0.8"/>
    <line x1="0" y1="105" x2="120" y2="105" stroke="#fcd34d" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="30" y2="140" stroke="#fcd34d" stroke-width="0.8"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="#fcd34d" stroke-width="0.8"/>
    <line x1="90" y1="0" x2="90" y2="140" stroke="#fcd34d" stroke-width="0.8"/>
    <!-- 高亮第 j 列（第 3 列） -->
    <rect x="60" y="0" width="30" height="140" fill="#f59e0b" fill-opacity="0.45" rx="1"/>
    <!-- 列标 j -->
    <text x="75" y="-25" text-anchor="middle" font-size="13" fill="#d97706" font-weight="bold">j</text>
  </g>
  <!-- B 跨步访问箭头 -->
  <g transform="translate(260, 235)">
    <line x1="75" y1="0" x2="75" y2="25" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#dc2626">步长 N（跨行访问）</text>
  </g>

  <!-- 等号 -->
  <text x="415" y="165" text-anchor="middle" font-size="26" fill="#555">=</text>

  <!-- C 矩阵 -->
  <g transform="translate(450, 80)">
    <text x="60" y="-10" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">C（行主序，M×N）</text>
    <rect x="0" y="0" width="120" height="140" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="2"/>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#86efac" stroke-width="0.8"/>
    <line x1="0" y1="70" x2="120" y2="70" stroke="#86efac" stroke-width="0.8"/>
    <line x1="0" y1="105" x2="120" y2="105" stroke="#86efac" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="30" y2="140" stroke="#86efac" stroke-width="0.8"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="#86efac" stroke-width="0.8"/>
    <line x1="90" y1="0" x2="90" y2="140" stroke="#86efac" stroke-width="0.8"/>
    <!-- 高亮 C[i,j]（第 2 行，第 3 列） -->
    <rect x="60" y="35" width="30" height="35" fill="#16a34a" fill-opacity="0.5" rx="2"/>
    <text x="75" y="58" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">C[i,j]</text>
  </g>
  <!-- C 写入箭头 -->
  <g transform="translate(450, 235)">
    <line x1="75" y1="0" x2="75" y2="25" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#16a34a">单次写入</text>
  </g>

  <!-- 公式说明 -->
  <g transform="translate(600, 130)">
    <text x="0" y="0" font-size="13" fill="#333">计算 C[i,j] 时：</text>
    <text x="0" y="25" font-size="12" fill="#2563eb">A 的第 i 行沿 k 连续</text>
    <text x="0" y="45" font-size="12" fill="#dc2626">B 的第 j 列沿 k 跨步</text>
    <text x="0" y="65" font-size="12" fill="#16a34a">C 的单个元素一次性写入</text>
  </g>

  <!-- ==================== 分隔线 ==================== -->
  <line x1="40" y1="300" x2="860" y2="300" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- ==================== 循环结构（左下） ==================== -->
  <g transform="translate(40, 320)">
    <text x="200" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">三重循环结构</text>
    
    <!-- i 循环框 -->
    <rect x="0" y="20" width="360" height="240" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
    <text x="10" y="40" font-size="12" fill="#475569" font-weight="bold">for i = 0 .. M-1</text>
    
    <!-- j 循环框 -->
    <rect x="20" y="55" width="320" height="190" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="30" y="75" font-size="12" fill="#475569" font-weight="bold">for j = 0 .. N-1</text>
    
    <!-- sum 初始化 -->
    <text x="40" y="100" font-size="11" fill="#6b7280">sum = 0</text>

    <!-- k 循环框 -->
    <rect x="40" y="115" width="280" height="110" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="50" y="135" font-size="12" fill="#475569" font-weight="bold">for k = 0 .. K-1</text>

    <!-- FMA 操作 -->
    <rect x="60" y="150" width="240" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="180" y="172" text-anchor="middle" font-size="12" fill="#1e40af">sum += A[i,k] * B[k,j]</text>

    <!-- C 写入 -->
    <rect x="60" y="195" width="240" height="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="3"/>
    <text x="180" y="212" text-anchor="middle" font-size="11" fill="#166534">C[i,j] = sum</text>
  </g>

  <!-- ==================== 依赖链（右下） ==================== -->
  <g transform="translate(460, 320)">
    <rect x="0" y="0" width="400" height="240" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" rx="6"/>
    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">单累加器依赖链</text>

    <!-- FMA 方框 -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="70" height="40" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" rx="4"/>
      <text x="35" y="25" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">FMA₁</text>
      
      <line x1="70" y1="20" x2="95" y2="20" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      
      <rect x="95" y="0" width="70" height="40" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" rx="4"/>
      <text x="130" y="25" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">FMA₂</text>

      <line x1="165" y1="20" x2="190" y2="20" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      
      <rect x="190" y="0" width="70" height="40" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" rx="4"/>
      <text x="225" y="25" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">FMA₃</text>

      <line x1="260" y1="20" x2="285" y2="20" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      
      <rect x="285" y="0" width="70" height="40" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" rx="4"/>
      <text x="320" y="25" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">FMA₄</text>
    </g>

    <!-- 依赖说明 -->
    <text x="200" y="130" text-anchor="middle" font-size="12" fill="#dc2626">每条 FMA 必须等待前一条完成</text>
    <text x="200" y="155" text-anchor="middle" font-size="12" fill="#dc2626">→ 流水线空闲，发射率低</text>

    <!-- 并行度说明 -->
    <g transform="translate(60, 185)">
      <rect x="0" y="0" width="280" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="4"/>
      <text x="140" y="25" text-anchor="middle" font-size="11" fill="#92400e">需要至少 8 条独立 FMA 才能填满流水线</text>
    </g>
  </g>

  <!-- 底部结论 -->
  <text x="450" y="650" text-anchor="middle" font-size="12" fill="#6b7280">朴素实现的两个瓶颈：B 的跨列访问导致缓存行利用率低；单累加器依赖链阻塞 FMA 流水线</text>
</svg>