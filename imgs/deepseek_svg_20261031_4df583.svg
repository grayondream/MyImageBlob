<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="284" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">ex_ret_instr / n：每迭代退休指令数（对数轴，n = 1 亿）</text>
  <text x="30" y="49" font-size="10" fill="#666">红色：被优化消除；绿色：保留执行；纵轴范围 0.01–10（对数）</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="65" width="640" height="170" fill="#f5f5f5"/>

  <!-- 水平网格：0.01 / 0.1 / 1 / 10 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="235" x2="720" y2="235"/>
    <line x1="80" y1="178.3" x2="720" y2="178.3"/>
    <line x1="80" y1="121.7" x2="720" y2="121.7"/>
    <line x1="80" y1="65" x2="720" y2="65"/>
  </g>

  <!-- y 轴 -->
  <line x1="80" y1="235" x2="80" y2="65" stroke="#333"/>
  <polygon points="80,65 77,71 83,71" fill="#333"/>
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="238">0.01</text>
    <text x="74" y="181.3">0.1</text>
    <text x="74" y="124.7">1</text>
    <text x="74" y="68">10</text>
  </g>
  <text x="20" y="150" font-size="10" fill="#555" transform="rotate(-90 20,150)">instr / iter（对数）</text>

  <!-- x 轴 -->
  <line x1="80" y1="235" x2="720" y2="235" stroke="#333"/>
  <polygon points="720,235 714,232 714,238" fill="#333"/>
  <text x="400" y="292" font-size="10" fill="#555" text-anchor="middle">版本 →</text>

  <!-- v1 朴素：0.032 -->
  <g>
    <rect x="140" y="206.4" width="80" height="28.6" fill="#c62828"/>
    <text x="180" y="200.4" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">0.032</text>
    <text x="180" y="256" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v1 朴素</text>
    <text x="180" y="272" font-size="9" fill="#c62828" text-anchor="middle">被消除</text>
  </g>

  <!-- v2 volatile：3.41 -->
  <g>
    <rect x="290" y="91.5" width="80" height="143.5" fill="#2e7d32"/>
    <text x="330" y="85.5" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">3.41</text>
    <text x="330" y="256" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v2 volatile</text>
    <text x="330" y="272" font-size="9" fill="#2e7d32" text-anchor="middle">保留</text>
  </g>

  <!-- v3 noinline：0.032 -->
  <g>
    <rect x="440" y="206.4" width="80" height="28.6" fill="#c62828"/>
    <text x="480" y="200.4" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">0.032</text>
    <text x="480" y="256" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v3 noinline</text>
    <text x="480" y="272" font-size="9" fill="#c62828" text-anchor="middle">仍被消除</text>
  </g>

  <!-- v4 循环内屏障：7.04 -->
  <g>
    <rect x="590" y="73.6" width="80" height="161.4" fill="#2e7d32"/>
    <text x="630" y="67.6" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">7.04</text>
    <text x="630" y="256" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">v4 循环内屏障</text>
    <text x="630" y="272" font-size="9" fill="#2e7d32" text-anchor="middle">完整保留</text>
  </g>
</svg>