<svg width="760" height="290" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="744" height="274" fill="#fafafa" stroke="#ccc"/>

  <!-- Dispatch Slots -->
  <rect x="290" y="35" width="180" height="36" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="316" y="58" font-size="12" font-weight="bold" fill="#1565c0">Dispatch Slots</text>

  <!-- 四个去向 -->
  <rect x="30" y="105" width="150" height="36" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="62" y="128" font-size="11" fill="#ef6c00" font-weight="bold">Frontend</text>

  <rect x="210" y="105" width="150" height="36" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="228" y="128" font-size="11" fill="#c62828" font-weight="bold">Bad Spec.</text>

  <rect x="390" y="105" width="150" height="36" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="434" y="128" font-size="11" fill="#2e7d32" font-weight="bold">Retiring</text>

  <rect x="570" y="105" width="150" height="36" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="602" y="128" font-size="11" fill="#4527a0" font-weight="bold">Backend</text>

  <!-- 分配箭头 -->
  <line x1="380" y1="71" x2="105" y2="105" stroke="#888" marker-end="url(#a2)"/>
  <line x1="380" y1="71" x2="285" y2="105" stroke="#888" marker-end="url(#a2)"/>
  <line x1="380" y1="71" x2="465" y2="105" stroke="#888" marker-end="url(#a2)"/>
  <line x1="380" y1="71" x2="645" y2="105" stroke="#888" marker-end="url(#a2)"/>

  <!-- 事件映射框 -->
  <rect x="20" y="175" width="170" height="55" fill="#fff" stroke="#ef6c00"/>
  <text x="38" y="197" font-size="10" fill="#ef6c00">op_cache_miss</text>
  <text x="38" y="215" font-size="10" fill="#ef6c00">de_dis_cops…</text>

  <rect x="210" y="175" width="150" height="55" fill="#fff" stroke="#c62828"/>
  <text x="228" y="197" font-size="10" fill="#c62828">ex_ret_brn_misp</text>
  <text x="228" y="215" font-size="10" fill="#c62828">L1 BTB</text>

  <rect x="390" y="175" width="150" height="55" fill="#fff" stroke="#2e7d32"/>
  <text x="430" y="207" font-size="10" fill="#2e7d32">ex_ret_instr</text>

  <rect x="570" y="175" width="170" height="55" fill="#fff" stroke="#4527a0"/>
  <text x="588" y="197" font-size="10" fill="#4527a0">ls_mab_alloc</text>
  <text x="588" y="215" font-size="10" fill="#4527a0">l2/l3 miss</text>

  <!-- 虚线连接 -->
  <line x1="105" y1="141" x2="105" y2="175" stroke="#ccc" stroke-dasharray="3,2"/>
  <line x1="285" y1="141" x2="285" y2="175" stroke="#ccc" stroke-dasharray="3,2"/>
  <line x1="465" y1="141" x2="465" y2="175" stroke="#ccc" stroke-dasharray="3,2"/>
  <line x1="645" y1="141" x2="645" y2="175" stroke="#ccc" stroke-dasharray="3,2"/>

  <text x="30" y="263" font-size="10" fill="#666">5600X 上：用原始事件映射到四桶，比 Intel 式自动四桶更可靠</text>
</svg>