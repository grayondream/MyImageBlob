<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="areaRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#f8fafc"/>

  <text x="460" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    TLB 命中率 vs. 工作集大小
  </text>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#64748b">
    4 KB 页在工作集超过 L2 TLB 覆盖范围后命中率骤降；2 MB 页全程保持接近 100%
  </text>

  <!-- 绘图区域 -->
  <rect x="110" y="92" width="700" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <!-- 水平网格线 -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="130" y1="132" x2="790" y2="132"/>
    <line x1="130" y1="200" x2="790" y2="200"/>
    <line x1="130" y1="268" x2="790" y2="268"/>
    <line x1="130" y1="336" x2="790" y2="336"/>
    <line x1="130" y1="404" x2="790" y2="404"/>
  </g>

  <!-- Y 轴标签 -->
  <g text-anchor="end" font-size="11" fill="#94a3b8">
    <text x="118" y="136">100%</text>
    <text x="118" y="204">75%</text>
    <text x="118" y="272">50%</text>
    <text x="118" y="340">25%</text>
    <text x="118" y="408">0%</text>
  </g>

  <!-- X 轴刻度 -->
  <line x1="130" y1="432" x2="800" y2="432" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="130" y1="432" x2="130" y2="440"/>
    <line x1="235" y1="432" x2="235" y2="440"/>
    <line x1="340" y1="432" x2="340" y2="440"/>
    <line x1="445" y1="432" x2="445" y2="440"/>
    <line x1="550" y1="432" x2="550" y2="440"/>
    <line x1="655" y1="432" x2="655" y2="440"/>
    <line x1="760" y1="432" x2="760" y2="440"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#64748b">
    <text x="130" y="458">64K</text>
    <text x="235" y="458">256K</text>
    <text x="340" y="458">1M</text>
    <text x="445" y="458">4M</text>
    <text x="550" y="458">16M</text>
    <text x="655" y="458">64M</text>
    <text x="760" y="458">256M</text>
  </g>
  <text x="460" y="486" text-anchor="middle" font-size="12" fill="#94a3b8">工作集大小（对数刻度）</text>

  <!-- Y 轴标题 -->
  <text x="56" y="262" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90 56 262)">TLB 命中率</text>

  <!-- 6 MB 覆盖线 -->
  <line x1="445" y1="108" x2="445" y2="432" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="368" y="88" width="154" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="445" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">6 MB — L2 TLB 覆盖线</text>

  <!-- 4 KB 页曲线下的面积 -->
  <path d="M130 132 L340 132 L445 132 L445 252 L550 376 L655 398 L760 404 L760 432 L130 432 Z"
        fill="url(#areaRed)"/>

  <!-- 4 KB 页曲线 -->
  <polyline fill="none" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
            points="130,132 235,132 340,132 445,252 550,376 655,398 760,404"/>

  <!-- 2 MB 页曲线 -->
  <polyline fill="none" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
            points="130,132 235,132 340,132 445,132 550,132 655,132 760,132"/>

  <!-- 数据点：4 KB 页 -->
  <g fill="#ef4444" stroke="#ffffff" stroke-width="1.5">
    <circle cx="130" cy="132" r="4.5"/>
    <circle cx="235" cy="132" r="4.5"/>
    <circle cx="340" cy="132" r="4.5"/>
    <circle cx="445" cy="252" r="5.5"/>
    <circle cx="550" cy="376" r="4.5"/>
    <circle cx="655" cy="398" r="4.5"/>
    <circle cx="760" cy="404" r="4.5"/>
  </g>

  <!-- 数据点：2 MB 页 -->
  <g fill="#3b82f6" stroke="#ffffff" stroke-width="1.5">
    <circle cx="130" cy="132" r="4.5"/>
    <circle cx="235" cy="132" r="4.5"/>
    <circle cx="340" cy="132" r="4.5"/>
    <circle cx="445" cy="132" r="4.5"/>
    <circle cx="550" cy="132" r="4.5"/>
    <circle cx="655" cy="132" r="4.5"/>
    <circle cx="760" cy="132" r="4.5"/>
  </g>

  <!-- 关键点注释：6 MB 处命中率跌破 50% -->
  <line x1="445" y1="252" x2="470" y2="240" stroke="#b91c1c" stroke-width="1.2"/>
  <rect x="472" y="224" width="148" height="36" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="480" y="238" font-size="10" font-weight="700" fill="#b91c1c">覆盖线处命中率 ≈ 50%</text>
  <text x="480" y="252" font-size="9" fill="#dc2626">随后急剧下降</text>

  <!-- 图例 -->
  <g filter="url(#shadow)">
    <rect x="600" y="150" width="176" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <line x1="616" y1="172" x2="650" y2="172" stroke="#ef4444" stroke-width="2.6"/>
  <text x="660" y="176" font-size="12" fill="#334155">4 KB 页</text>
  <line x1="616" y1="198" x2="650" y2="198" stroke="#3b82f6" stroke-width="2.6"/>
  <text x="660" y="202" font-size="12" fill="#334155">2 MB 页</text>

  <!-- 底部说明 -->
  <rect x="90" y="504" width="740" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <circle cx="122" cy="526" r="4" fill="#ef4444"/>
  <text x="136" y="530" font-size="11" fill="#334155">4 KB 页：工作集超过 6 MB 后 TLB 覆盖不足，命中率迅速下滑</text>
  <circle cx="566" cy="526" r="4" fill="#3b82f6"/>
  <text x="580" y="530" font-size="11" fill="#334155">2 MB 页：全程稳定，命中率接近 100%</text>
</svg>