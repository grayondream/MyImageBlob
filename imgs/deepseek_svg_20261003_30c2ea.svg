<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6f9"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="gradV2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="100%" stop-color="#b8e0f0"/>
    </linearGradient>
    <linearGradient id="gradV3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8b6e2"/>
      <stop offset="100%" stop-color="#e0d4f0"/>
    </linearGradient>
    <linearGradient id="gradV4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8d8b9"/>
      <stop offset="100%" stop-color="#c8e8d4"/>
    </linearGradient>
    <linearGradient id="gradV5" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9d89c"/>
      <stop offset="100%" stop-color="#fce8c8"/>
    </linearGradient>
    <linearGradient id="gradV6" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b5a8e0"/>
      <stop offset="100%" stop-color="#d8d0f0"/>
    </linearGradient>
    <filter id="shadowBar" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="1080" height="760" fill="url(#bg)" rx="12"/>

  <!-- 标题 -->
  <text x="540" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#3a3a5c">GEMM v2 / v3 / v4 / v5 / v6 综合对比</text>
  <text x="540" y="72" text-anchor="middle" font-size="13" fill="#8888a8">柱状：GFLOPS（越高越好） · 折线：耗时 ms（越低越好） · 单线程 · 对数坐标</text>

  <!-- 图例 -->
  <g transform="translate(80, 92)">
    <rect x="0" y="0" width="15" height="15" rx="4" fill="url(#gradV2)" filter="url(#shadowBar)"/>
    <text x="20" y="12" font-size="11" fill="#555577">v2 GFLOPS</text>
    <rect x="110" y="0" width="15" height="15" rx="4" fill="url(#gradV3)" filter="url(#shadowBar)"/>
    <text x="130" y="12" font-size="11" fill="#555577">v3 GFLOPS</text>
    <rect x="220" y="0" width="15" height="15" rx="4" fill="url(#gradV4)" filter="url(#shadowBar)"/>
    <text x="240" y="12" font-size="11" fill="#555577">v4 GFLOPS</text>
    <rect x="330" y="0" width="15" height="15" rx="4" fill="url(#gradV5)" filter="url(#shadowBar)"/>
    <text x="350" y="12" font-size="11" fill="#555577">v5 GFLOPS</text>
    <rect x="440" y="0" width="15" height="15" rx="4" fill="url(#gradV6)" filter="url(#shadowBar)"/>
    <text x="460" y="12" font-size="11" fill="#555577">v6 GFLOPS</text>
    <line x1="570" y1="7" x2="598" y2="7" stroke="#5a9ab5" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="584" cy="7" r="3.5" fill="#5a9ab5"/>
    <text x="606" y="12" font-size="11" fill="#555577">v2 耗时</text>
    <line x1="680" y1="7" x2="708" y2="7" stroke="#9b8ab8" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="694" cy="7" r="3.5" fill="#9b8ab8"/>
    <text x="716" y="12" font-size="11" fill="#555577">v3 耗时</text>
    <line x1="790" y1="7" x2="818" y2="7" stroke="#6aab7a" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="804" cy="7" r="3.5" fill="#6aab7a"/>
    <text x="826" y="12" font-size="11" fill="#555577">v4 耗时</text>
    <line x1="900" y1="7" x2="928" y2="7" stroke="#c9a040" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="914" cy="7" r="3.5" fill="#c9a040"/>
    <text x="936" y="12" font-size="11" fill="#555577">v5 耗时</text>
    <line x1="1010" y1="7" x2="1038" y2="7" stroke="#8a7ac0" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="1024" cy="7" r="3.5" fill="#8a7ac0"/>
    <text x="1046" y="12" font-size="11" fill="#555577">v6 耗时</text>
  </g>

  <!-- 图表区域 -->
  <g transform="translate(110, 130)">

    <!-- ===== 左侧 Y轴：GFLOPS ===== -->
    <line x1="0" y1="430" x2="840" y2="430" stroke="#e8e8f0" stroke-width="1"/>
    <text x="-10" y="434" text-anchor="end" font-size="11" fill="#aaaacc">10</text>

    <line x1="0" y1="323" x2="840" y2="323" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="327" text-anchor="end" font-size="11" fill="#aaaacc">20</text>

    <line x1="0" y1="215" x2="840" y2="215" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="219" text-anchor="end" font-size="11" fill="#aaaacc">40</text>

    <line x1="0" y1="108" x2="840" y2="108" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="112" text-anchor="end" font-size="11" fill="#aaaacc">80</text>

    <line x1="0" y1="0" x2="840" y2="0" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-10" y="4" text-anchor="end" font-size="11" fill="#aaaacc">160</text>

    <text x="-60" y="215" text-anchor="middle" font-size="13" fill="#8888a8" transform="rotate(-90, -60, 215)">GFLOPS（柱状）</text>

    <!-- ===== 右侧 Y轴：耗时（ms） ===== -->
    <line x1="840" y1="430" x2="840" y2="0" stroke="#d0d0e0" stroke-width="1.5"/>
    <text x="850" y="434" text-anchor="start" font-size="11" fill="#aaaacc">0.3</text>
    <text x="850" y="369" text-anchor="start" font-size="11" fill="#aaaacc">1</text>
    <text x="850" y="246" text-anchor="start" font-size="11" fill="#aaaacc">10</text>
    <text x="850" y="123" text-anchor="start" font-size="11" fill="#aaaacc">100</text>
    <text x="850" y="4" text-anchor="start" font-size="11" fill="#aaaacc">1000</text>

    <text x="915" y="215" text-anchor="middle" font-size="13" fill="#8888a8" transform="rotate(90, 915, 215)">耗时 ms（折线）</text>

    <!-- ===== 计算坐标 ===== -->

    <!--
      GFLOPS → y = 430 - (log10(g) - 1) * 122.86

      v2: 35.16 → log=1.546 → y=430-0.546*122.86=362.9
          27.97 → log=1.447 → y=430-0.447*122.86=375.1
          33.46 → log=1.524 → y=430-0.524*122.86=365.6

      v3: 34.47 → log=1.537 → y=430-0.537*122.86=364.0
          24.17 → log=1.383 → y=430-0.383*122.86=382.9
          23.45 → log=1.370 → y=430-0.370*122.86=384.5

      v4: 42.81 → log=1.632 → y=430-0.632*122.86=352.4
          34.97 → log=1.544 → y=430-0.544*122.86=363.2
          32.81 → log=1.516 → y=430-0.516*122.86=366.6

      v5: 34.98 → log=1.544 → y=430-0.544*122.86=363.2
          33.74 → log=1.528 → y=430-0.528*122.86=365.1
          32.39 → log=1.510 → y=430-0.510*122.86=367.4

      v6: 54.84 → log=1.739 → y=430-0.739*122.86=339.2
          65.80 → log=1.818 → y=430-0.818*122.86=329.5
          60.28 → log=1.780 → y=430-0.780*122.86=334.2

      耗时 ms → y = 430 - (log10(ms) + 0.5) * 122.86

      v2: 0.954 → log=-0.020 → y=430-0.480*122.86=371.0
          76.77 → log=1.885 → y=430-2.385*122.86=137.0
          513.44 → log=2.710 → y=430-3.210*122.86=35.6

      v3: 0.973 → log=-0.012 → y=430-0.488*122.86=370.0
          88.85 → log=1.949 → y=430-2.449*122.86=129.2
          732.63 → log=2.865 → y=430-3.365*122.86=16.5

      v4: 0.784 → log=-0.106 → y=430-0.394*122.86=381.6
          61.42 → log=1.788 → y=430-2.288*122.86=148.9
          523.57 → log=2.719 → y=430-3.219*122.86=34.5

      v5: 0.959 → log=-0.018 → y=430-0.482*122.86=370.8
          63.65 → log=1.804 → y=430-2.304*122.86=146.9
          530.48 → log=2.725 → y=430-3.225*122.86=33.8

      v6: 0.612 → log=-0.213 → y=430-0.287*122.86=394.7
          32.64 → log=1.514 → y=430-2.014*122.86=182.5
          285.00 → log=2.455 → y=430-2.955*122.86=66.9
    -->

    <!-- 第一组：256³ -->
    <g>
      <rect x="30" y="363" width="26" height="67" rx="4" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="43" y="356" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">35.2</text>

      <rect x="62" y="364" width="26" height="66" rx="4" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="75" y="357" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">34.5</text>

      <rect x="94" y="352" width="26" height="78" rx="4" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="107" y="345" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">42.8</text>

      <rect x="126" y="363" width="26" height="67" rx="4" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="139" y="356" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">35.0</text>

      <rect x="158" y="339" width="26" height="91" rx="4" fill="url(#gradV6)" filter="url(#shadowBar)"/>
      <text x="171" y="332" text-anchor="middle" font-size="8" font-weight="600" fill="#8a7ac0">54.8</text>

      <!-- 耗时点 -->
      <circle cx="43" cy="371" r="3.5" fill="#5a9ab5" stroke="#fff" stroke-width="1.2"/>
      <circle cx="75" cy="370" r="3.5" fill="#9b8ab8" stroke="#fff" stroke-width="1.2"/>
      <circle cx="107" cy="382" r="3.5" fill="#6aab7a" stroke="#fff" stroke-width="1.2"/>
      <circle cx="139" cy="371" r="3.5" fill="#c9a040" stroke="#fff" stroke-width="1.2"/>
      <circle cx="171" cy="395" r="3.5" fill="#8a7ac0" stroke="#fff" stroke-width="1.2"/>

      <text x="107" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">256³</text>
    </g>

    <!-- 第二组：1024³ -->
    <g>
      <rect x="290" y="375" width="26" height="55" rx="4" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="303" y="368" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">28.0</text>

      <rect x="322" y="383" width="26" height="47" rx="4" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="335" y="376" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">24.2</text>

      <rect x="354" y="363" width="26" height="67" rx="4" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="367" y="356" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">35.0</text>

      <rect x="386" y="365" width="26" height="65" rx="4" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="399" y="358" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">33.7</text>

      <rect x="418" y="330" width="26" height="100" rx="4" fill="url(#gradV6)" filter="url(#shadowBar)"/>
      <text x="431" y="323" text-anchor="middle" font-size="8" font-weight="600" fill="#8a7ac0">65.8</text>

      <!-- 耗时点 -->
      <circle cx="303" cy="137" r="3.5" fill="#5a9ab5" stroke="#fff" stroke-width="1.2"/>
      <circle cx="335" cy="129" r="3.5" fill="#9b8ab8" stroke="#fff" stroke-width="1.2"/>
      <circle cx="367" cy="149" r="3.5" fill="#6aab7a" stroke="#fff" stroke-width="1.2"/>
      <circle cx="399" cy="147" r="3.5" fill="#c9a040" stroke="#fff" stroke-width="1.2"/>
      <circle cx="431" cy="183" r="3.5" fill="#8a7ac0" stroke="#fff" stroke-width="1.2"/>

      <text x="367" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">1024³</text>
    </g>

    <!-- 第三组：2048³ -->
    <g>
      <rect x="550" y="366" width="26" height="64" rx="4" fill="url(#gradV2)" filter="url(#shadowBar)"/>
      <text x="563" y="359" text-anchor="middle" font-size="8" font-weight="600" fill="#5a9ab5">33.5</text>

      <rect x="582" y="385" width="26" height="45" rx="4" fill="url(#gradV3)" filter="url(#shadowBar)"/>
      <text x="595" y="378" text-anchor="middle" font-size="8" font-weight="600" fill="#9b8ab8">23.4</text>

      <rect x="614" y="367" width="26" height="63" rx="4" fill="url(#gradV4)" filter="url(#shadowBar)"/>
      <text x="627" y="360" text-anchor="middle" font-size="8" font-weight="600" fill="#6aab7a">32.8</text>

      <rect x="646" y="367" width="26" height="63" rx="4" fill="url(#gradV5)" filter="url(#shadowBar)"/>
      <text x="659" y="360" text-anchor="middle" font-size="8" font-weight="600" fill="#c9a040">32.4</text>

      <rect x="678" y="334" width="26" height="96" rx="4" fill="url(#gradV6)" filter="url(#shadowBar)"/>
      <text x="691" y="327" text-anchor="middle" font-size="8" font-weight="600" fill="#8a7ac0">60.3</text>

      <!-- 耗时点 -->
      <circle cx="563" cy="36" r="3.5" fill="#5a9ab5" stroke="#fff" stroke-width="1.2"/>
      <circle cx="595" cy="17" r="3.5" fill="#9b8ab8" stroke="#fff" stroke-width="1.2"/>
      <circle cx="627" cy="35" r="3.5" fill="#6aab7a" stroke="#fff" stroke-width="1.2"/>
      <circle cx="659" cy="34" r="3.5" fill="#c9a040" stroke="#fff" stroke-width="1.2"/>
      <circle cx="691" cy="67" r="3.5" fill="#8a7ac0" stroke="#fff" stroke-width="1.2"/>

      <text x="627" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#666688">2048³</text>
    </g>

    <!-- 折线连接 -->
    <polyline points="43,371 303,137 563,36" fill="none" stroke="#5a9ab5" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="75,370 335,129 595,17" fill="none" stroke="#9b8ab8" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="107,382 367,149 627,35" fill="none" stroke="#6aab7a" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="139,371 399,147 659,34" fill="none" stroke="#c9a040" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
    <polyline points="171,395 431,183 691,67" fill="none" stroke="#8a7ac0" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>

    <!-- X轴 -->
    <line x1="0" y1="430" x2="840" y2="430" stroke="#c0c0d8" stroke-width="1.5"/>
  </g>

  <!-- 底部数据摘要 -->
  <g transform="translate(110, 600)">
    <rect x="0" y="0" width="840" height="104" rx="8" fill="#ffffff88" stroke="#e0e0f0" stroke-width="1"/>

    <text x="18" y="22" font-size="12" font-weight="700" fill="#5a9ab5">v2（ikj 循环交换）</text>
    <text x="18" y="42" font-size="11" fill="#8888a8">GFLOPS：35.2 → 28.0 → 33.5</text>
    <text x="18" y="60" font-size="11" fill="#8888a8">耗时：0.95ms → 76.8ms → 513.4ms</text>

    <text x="240" y="22" font-size="12" font-weight="700" fill="#9b8ab8">v3（缓存分块）</text>
    <text x="240" y="42" font-size="11" fill="#8888a8">GFLOPS：34.5 → 24.2 → 23.4</text>
    <text x="240" y="60" font-size="11" fill="#8888a8">耗时：0.97ms → 88.9ms → 732.6ms</text>

    <text x="470" y="22" font-size="12" font-weight="700" fill="#6aab7a">v4（分块 + 打包）</text>
    <text x="470" y="42" font-size="11" fill="#8888a8">GFLOPS：42.8 → 35.0 → 32.8</text>
    <text x="470" y="60" font-size="11" fill="#8888a8">耗时：0.78ms → 61.4ms → 523.6ms</text>

    <text x="18" y="80" font-size="12" font-weight="700" fill="#c9a040">v5（分块 + 打包 + 微内核）</text>
    <text x="240" y="80" font-size="11" fill="#8888a8">GFLOPS：35.0 → 33.7 → 32.4</text>
    <text x="470" y="80" font-size="11" fill="#8888a8">耗时：0.96ms → 63.7ms → 530.5ms</text>

    <text x="650" y="80" font-size="12" font-weight="700" fill="#8a7ac0">v6（AVX2 微内核）</text>
    <text x="650" y="98" font-size="11" fill="#8a7ac0">GFLOPS：54.8 → 65.8 → 60.3（全面领先）</text>
  </g>
</svg>