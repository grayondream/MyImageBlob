<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="a2o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="24" y="60" width="150" height="380" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="99" y="84" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">HBM</text>

  <rect x="44" y="100" width="110" height="42" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="99" y="126" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">Q</text>

  <rect x="44" y="160" width="110" height="42" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="99" y="186" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">K</text>

  <rect x="44" y="220" width="110" height="42" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="99" y="246" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">V</text>

  <rect x="44" y="360" width="110" height="42" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="99" y="386" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">O</text>

  <rect x="260" y="60" width="440" height="380" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="480" y="84" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">SRAM（片上，每 SM ~192 KB）</text>

  <rect x="290" y="105" width="120" height="46" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
  <text x="350" y="124" font-size="13" fill="#78350f" text-anchor="middle" font-weight="600">Q_i</text>
  <text x="350" y="141" font-size="10.5" fill="#92400e" text-anchor="middle">常驻</text>

  <rect x="290" y="180" width="120" height="46" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="350" y="199" font-size="13" fill="#78350f" text-anchor="middle" font-weight="600">K_j, V_j</text>
  <text x="350" y="216" font-size="10.5" fill="#92400e" text-anchor="middle">逐块换入</text>

  <rect x="460" y="180" width="100" height="46" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="510" y="199" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="600">S_ij</text>
  <text x="510" y="216" font-size="10.5" fill="#b91c1c" text-anchor="middle">临时</text>

  <rect x="460" y="250" width="100" height="46" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="510" y="269" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="600">P_ij</text>
  <text x="510" y="286" font-size="10.5" fill="#b91c1c" text-anchor="middle">临时</text>

  <rect x="460" y="320" width="200" height="58" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
  <text x="560" y="340" font-size="12" fill="#78350f" text-anchor="middle" font-weight="600">m,  ℓ,  Õ</text>
  <text x="560" y="357" font-size="10.5" fill="#92400e" text-anchor="middle">运行态累积，含修正因子重缩放</text>
  <text x="560" y="371" font-size="10.5" fill="#92400e" text-anchor="middle">循环结束后 O_i = Õ / ℓ</text>

  <rect x="740" y="60" width="196" height="380" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="838" y="84" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">计算单元</text>

  <rect x="766" y="110" width="144" height="46" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="838" y="130" font-size="12" fill="#312e81" text-anchor="middle" font-weight="600">GEMM 1</text>
  <text x="838" y="147" font-size="10.5" fill="#4338ca" text-anchor="middle">Q_i · K_jᵀ</text>

  <rect x="766" y="185" width="144" height="46" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="838" y="205" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">softmax 更新</text>
  <text x="838" y="222" font-size="10.5" fill="#64748b" text-anchor="middle">CUDA Core：exp / max</text>

  <rect x="766" y="260" width="144" height="46" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="838" y="280" font-size="12" fill="#312e81" text-anchor="middle" font-weight="600">GEMM 2</text>
  <text x="838" y="297" font-size="10.5" fill="#4338ca" text-anchor="middle">P_ij · V_j → Õ</text>

  <text x="838" y="350" font-size="10.5" fill="#94a3b8" text-anchor="middle">Tensor Core 与 CUDA Core</text>
  <text x="838" y="366" font-size="10.5" fill="#94a3b8" text-anchor="middle">在 kernel 内交替执行</text>

  <path d="M154,121 L288,126" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="220" y="112" font-size="10" fill="#64748b" text-anchor="middle">一次</text>

  <path d="M154,181 L288,199" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#a2o)" stroke-dasharray="5 3"/>
  <path d="M154,241 L288,212" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#a2o)" stroke-dasharray="5 3"/>
  <text x="220" y="170" font-size="10" fill="#ea580c" text-anchor="middle">循环</text>

  <path d="M560,378 L560,460 L154,460 L154,400" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="360" y="452" font-size="10.5" fill="#64748b" text-anchor="middle">O_i 写回，一次</text>

  <path d="M410,128 L455,175" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <path d="M410,200 L455,200" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <path d="M560,226 L560,248" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <path d="M560,296 L560,318" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>

  <circle cx="215" cy="290" r="22" fill="#fff" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="201" y1="276" x2="229" y2="304" stroke="#dc2626" stroke-width="2.2"/>
  <text x="215" y="330" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600">S/P 永不</text>
  <text x="215" y="344" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600">写入 HBM</text>
</svg>