<svg width="760" height="290" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="274" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="34" font-size="13" font-weight="bold" fill="#333">工作集—延迟台阶：跳跃在 24 到 32MB 之间，不在规格的 32MB</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="55" width="640" height="175" fill="#f5f5f5"/>

  <!-- 水平网格：0–50 ns -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="195" x2="720" y2="195"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="125" x2="720" y2="125"/>
    <line x1="80" y1="90" x2="720" y2="90"/>
    <line x1="80" y1="55" x2="720" y2="55"/>
  </g>

  <!-- 参考线 -->
  <line x1="80" y1="175" x2="390" y2="175" stroke="#2e7d32" stroke-dasharray="4,3"/>
  <text x="90" y="170" font-size="10" fill="#2e7d32" font-weight="bold">L3 供给</text>

  <line x1="390" y1="90" x2="720" y2="90" stroke="#c62828" stroke-dasharray="4,3"/>
  <text x="500" y="85" font-size="10" fill="#c62828" font-weight="bold">DRAM 延迟</text>

  <!-- 实际边界：24–32MB -->
  <line x1="340" y1="55" x2="340" y2="230" stroke="#4527a0" stroke-dasharray="5,3"/>
  <text x="300" y="48" font-size="10" fill="#4527a0" font-weight="bold">实际边界 24–32MB</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="230" x2="720" y2="230" stroke="#333"/>
  <line x1="80" y1="230" x2="80" y2="55" stroke="#333"/>
  <polygon points="720,230 714,227 714,233" fill="#333"/>
  <polygon points="80,55 77,61 83,61" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="233">0</text>
    <text x="74" y="198">10</text>
    <text x="74" y="163">20</text>
    <text x="74" y="128">30</text>
    <text x="74" y="93">40</text>
    <text x="74" y="58">50</text>
  </g>

  <!-- x 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="middle">
    <text x="160" y="248">16 MB</text>
    <text x="280" y="248">24 MB</text>
    <text x="400" y="248">32 MB</text>
    <text x="520" y="248">40 MB</text>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="160" y1="230" x2="160" y2="235"/>
    <line x1="280" y1="230" x2="280" y2="235"/>
    <line x1="400" y1="230" x2="400" y2="235"/>
    <line x1="520" y1="230" x2="520" y2="235"/>
  </g>

  <!-- 折线：14.0 / 24.8 / 41.3 / 42.7 ns -->
  <polyline points="160,181 280,143.2 400,85.45 520,80.55"
            fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- 数据点 -->
  <circle cx="160" cy="181" r="5" fill="#2e7d32"/>
  <circle cx="280" cy="143.2" r="5" fill="#ef6c00"/>
  <circle cx="400" cy="85.45" r="5" fill="#c62828"/>
  <circle cx="520" cy="80.55" r="5" fill="#c62828"/>

  <!-- 数值标签 -->
  <text x="160" y="176" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">14.0</text>
  <text x="280" y="138" font-size="11" fill="#ef6c00" font-weight="bold" text-anchor="middle">24.8</text>
  <text x="400" y="80" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">41.3</text>
  <text x="520" y="75" font-size="11" fill="#c62828" font-weight="bold" text-anchor="middle">42.7</text>

  <!-- 轴标题 -->
  <text x="400" y="272" font-size="10" fill="#555" text-anchor="middle">工作集（MB）→</text>
  <text x="20" y="145" font-size="10" fill="#555" transform="rotate(-90 20,145)">ns / access</text>
</svg>