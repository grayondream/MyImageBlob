<svg width="760" height="230" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="744" height="214" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="28" y="34" font-size="14" font-weight="700" fill="#111827">一个周期内 6 个流水线槽位的四种去向</text>

  <!-- 6 个槽位 -->
  <g>
    <rect x="30" y="52" width="110" height="48" rx="6" fill="url(#greenGrad)"/>
    <text x="85" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Retire</text>

    <rect x="148" y="52" width="110" height="48" rx="6" fill="url(#greenGrad)"/>
    <text x="203" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Retire</text>

    <rect x="266" y="52" width="110" height="48" rx="6" fill="url(#orangeGrad)"/>
    <text x="321" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Bad Spec</text>

    <rect x="384" y="52" width="110" height="48" rx="6" fill="url(#redGrad)"/>
    <text x="439" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">FE Bound</text>

    <rect x="502" y="52" width="110" height="48" rx="6" fill="url(#redGrad)"/>
    <text x="557" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">BE Bound</text>

    <rect x="620" y="52" width="110" height="48" rx="6" fill="url(#grayGrad)"/>
    <text x="675" y="81" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">空闲</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(30,128)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#greenGrad)"/>
    <text x="20" y="11" font-size="10" fill="#374151">Retiring</text>

    <rect x="100" y="0" width="14" height="14" rx="3" fill="url(#orangeGrad)"/>
    <text x="120" y="11" font-size="10" fill="#374151">Bad Speculation</text>

    <rect x="240" y="0" width="14" height="14" rx="3" fill="url(#redGrad)"/>
    <text x="260" y="11" font-size="10" fill="#374151">FE / BE Bound</text>

    <rect x="380" y="0" width="14" height="14" rx="3" fill="url(#grayGrad)"/>
    <text x="400" y="11" font-size="10" fill="#374151">核心提供的槽位</text>
  </g>

  <!-- 说明 -->
  <text x="30" y="200" font-size="10" fill="#6b7280">TMA 把这 6 个槽位的去向互斥地归入四类；总和即 Level 1 百分比。</text>
</svg>