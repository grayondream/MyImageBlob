<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="8" y="8" width="744" height="284" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="32" font-size="13" font-weight="bold" fill="#333">三条件中位数几乎相同，方差依次上升：均值在噪声内，方差有信息</text>

  <!-- 绘图区背景 -->
  <rect x="80" y="60" width="640" height="175" fill="#f5f5f5"/>

  <!-- 水平网格：1160 / 1180 / 1200 / 1220 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="60" x2="720" y2="60"/>
    <line x1="80" y1="110" x2="720" y2="110"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="210" x2="720" y2="210"/>
  </g>

  <!-- 1200 参考线 -->
  <line x1="80" y1="110" x2="720" y2="110" stroke="#999" stroke-dasharray="3,3"/>

  <!-- baseline 噪声带 1190–1205 M -->
  <rect x="80" y="97.5" width="640" height="37.5" fill="#e8f5e9" opacity="0.65"/>
  <text x="710" y="92" font-size="9" fill="#2e7d32" font-weight="bold" text-anchor="end">baseline 噪声带 1190–1205 M</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="235" x2="720" y2="235" stroke="#333"/>
  <line x1="80" y1="235" x2="80" y2="60" stroke="#333"/>
  <polygon points="720,235 714,232 714,238" fill="#333"/>
  <polygon points="80,60 77,66 83,66" fill="#333"/>

  <!-- y 轴刻度 -->
  <g font-size="9" fill="#555" text-anchor="end">
    <text x="74" y="63">1220</text>
    <text x="74" y="113">1200</text>
    <text x="74" y="163">1180</text>
    <text x="74" y="213">1160</text>
    <text x="74" y="238">1150</text>
  </g>

  <!-- baseline：1200.8 -->
  <g>
    <rect x="150" y="108" width="90" height="127" fill="#1565c0"/>
    <text x="195" y="102" font-size="11" fill="#1565c0" font-weight="bold" text-anchor="middle">1200.8</text>
    <text x="195" y="255" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">baseline</text>
    <text x="195" y="270" font-size="9" fill="#1565c0" text-anchor="middle">cv 0.71%</text>
  </g>

  <!-- eBPF：1193.3 -->
  <g>
    <rect x="310" y="126.75" width="90" height="108.25" fill="#2e7d32"/>
    <text x="355" y="120.75" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">1193.3</text>
    <text x="355" y="255" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">eBPF</text>
    <text x="355" y="270" font-size="9" fill="#2e7d32" font-weight="bold" text-anchor="middle">-0.62% / cv 1.04%</text>
  </g>

  <!-- perf：1200.1 -->
  <g>
    <rect x="470" y="109.75" width="90" height="125.25" fill="#ef6c00"/>
    <text x="515" y="103.75" font-size="11" fill="#ef6c00" font-weight="bold" text-anchor="middle">1200.1</text>
    <text x="515" y="255" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">perf</text>
    <text x="515" y="270" font-size="9" fill="#ef6c00" font-weight="bold" text-anchor="middle">-0.06% / cv 1.49%</text>
  </g>

  <!-- 轴标题 -->
  <text x="400" y="288" font-size="10" fill="#555" text-anchor="middle">条件 →</text>
  <text x="20" y="150" font-size="10" fill="#555" transform="rotate(-90 20,150)">M req/s</text>

  <!-- 说明 -->
  <text x="30" y="300" font-size="9" fill="#666">注：纵轴截断为 1150–1220 M，柱高按中位数真实比例绘制；绿色带为 baseline 的噪声区间。</text>
</svg>