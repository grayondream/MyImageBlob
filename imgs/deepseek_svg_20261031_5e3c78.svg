<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="744" height="284" fill="#fafafa" stroke="#ccc"/>

  <text x="30" y="34" font-size="13" font-weight="bold" fill="#333">屏障位置决定保护对象：v3 失败 / v4 成功的结构原因</text>

  <!-- v3：屏障在函数外 -->
  <rect x="30" y="55" width="330" height="215" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="130" y="80" font-size="12" font-weight="bold" fill="#c62828">v3：屏障在函数外</text>

  <rect x="60" y="100" width="270" height="90" fill="#ffebee" stroke="#c62828" stroke-dasharray="4,3"/>
  <text x="72" y="118" font-size="10" fill="#c62828" font-weight="bold">simple_sum_noinline() 内部</text>

  <rect x="80" y="130" width="230" height="30" fill="#fff" stroke="#c62828"/>
  <text x="92" y="150" font-size="10" fill="#333">for (i...) s += i;  ← 被归纳</text>
  <text x="200" y="178" font-size="10" fill="#c62828" font-weight="bold">→ s = n*(n-1)/2</text>

  <rect x="90" y="205" width="220" height="42" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="102" y="222" font-size="10" fill="#ef6c00" font-weight="bold">asm 屏障（函数外）</text>
  <text x="102" y="240" font-size="9" fill="#666">只保护返回值不被消除</text>

  <line x1="200" y1="190" x2="200" y2="205" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar1)"/>

  <!-- v4：屏障在循环内 -->
  <rect x="400" y="55" width="330" height="215" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="80" font-size="12" font-weight="bold" fill="#2e7d32">v4：屏障在循环内</text>

  <rect x="430" y="100" width="270" height="140" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="442" y="118" font-size="10" fill="#2e7d32" font-weight="bold">run_bench&lt;4&gt;()</text>

  <rect x="450" y="130" width="230" height="30" fill="#fff" stroke="#2e7d32"/>
  <text x="462" y="150" font-size="10" fill="#333">for (i...) {</text>

  <rect x="470" y="165" width="190" height="28" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="482" y="183" font-size="10" fill="#ef6c00" font-weight="bold">asm 屏障（循环内）</text>

  <text x="462" y="212" font-size="10" fill="#333">  s += i;</text>
  <text x="462" y="228" font-size="10" fill="#333">}</text>
  <text x="510" y="248" font-size="10" fill="#2e7d32" font-weight="bold">→ 循环无法被归纳</text>
</svg>