<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="920" height="560" fill="#f8fafc"/>

  <text x="460" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    L2 TLB 条目数：容量 vs. 工作集需求
  </text>
  <text x="460" y="66" text-anchor="middle" font-size="12" fill="#64748b">
    74 MB 工作集下：4 KB 页需 18 944 条，2 MB 页仅需 37 条（条形高度为示意，数字为计算值）
  </text>

  <!-- Y 轴 -->
  <text x="44" y="300" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90 44 300)">条目数（示意）</text>
  <line x1="110" y1="110" x2="110" y2="430" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 条形：可用容量 -->
  <g filter="url(#shadow)">
    <rect x="170" y="240" width="140" height="190" rx="8" fill="url(#gBlue)"/>
  </g>
  <text x="240" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">1 536</text>
  <text x="240" y="340" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.75">容量上限</text>

  <!-- 条形：4 KB 页需求 -->
  <g filter="url(#shadow)">
    <rect x="380" y="140" width="140" height="290" rx="8" fill="url(#gRed)"/>
  </g>
  <text x="450" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">18 944</text>
  <text x="450" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">超容 12.3×</text>

  <!-- 条形：2 MB 页需求 -->
  <g filter="url(#shadow)">
    <rect x="590" y="340" width="140" height="90" rx="8" fill="url(#gGreen)"/>
  </g>
  <text x="660" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">37</text>
  <text x="660" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">利用率 2.4%</text>

  <!-- 容量参考线 -->
  <line x1="130" y1="240" x2="800" y2="240" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="676" y="226" width="128" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="740" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">容量线 1 536</text>

  <!-- 基线 -->
  <line x1="110" y1="430" x2="820" y2="430" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- X 轴标签 -->
  <g text-anchor="middle">
    <text x="240" y="454" font-size="12" font-weight="600" fill="#334155">可用 L2 TLB</text>
    <text x="240" y="476" font-size="11" fill="#94a3b8">1536 条目</text>

    <text x="450" y="454" font-size="12" font-weight="600" fill="#334155">4 KB 页需求</text>
    <text x="450" y="476" font-size="11" font-weight="700" fill="#be123c">超容 12.3 倍</text>

    <text x="660" y="454" font-size="12" font-weight="600" fill="#334155">2 MB 页需求</text>
    <text x="660" y="476" font-size="11" font-weight="700" fill="#047857">仅占 2.4%</text>
  </g>

  <!-- 结论条 -->
  <rect x="60" y="496" width="800" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <circle cx="92" cy="518" r="4" fill="#be123c"/>
  <text x="106" y="522" font-size="12" fill="#334155">4 KB 页：TLB 严重不足，工作集反复抖动</text>
  <circle cx="524" cy="518" r="4" fill="#047857"/>
  <text x="538" y="522" font-size="12" fill="#334155">2 MB 页：37 条即可全部容纳，命中率接近 100%</text>
</svg>